[package]
name = "bloom-it"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "End-to-end integration tests for bloom"
publish = false

[features]
default = []
# Forwards to bloom-revert/bytecode-decompile so the heimdall-fallback
# integration test (`tests/revert_decoding_fallbacks.rs`) compiles.
bytecode-decompile = ["bloom-revert/bytecode-decompile"]

[dependencies]
bloom-proto.workspace = true
bloom-evm.workspace = true
bloom-watch.workspace = true
bloom-tx.workspace = true
bloom-vfs.workspace = true
bloom-daemon.workspace = true
bloom-solana-tx.workspace = true
bloom-machine-client.workspace = true
bloom-broker-api.workspace = true
bloom-signer-derive = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "18fb12ddea1113478c5ca926f2f711e212ba839e" }
ed25519-dalek.workspace = true
bs58.workspace = true
bloom-revert.workspace = true
alloy.workspace = true
alloy-signer-local = "2.0.5"
anyhow.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
futures.workspace = true
base64.workspace = true
parking_lot.workspace = true
