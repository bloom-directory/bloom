[package]
name = "bloom-contract"
version = "0.1.0"
edition = "2024"
description = "Bloom Rust smart-contract framework: prelude, types, ABI traits, storage, context, interfaces."
license = "MIT"

[lib]
name = "bloom_contract"

[dependencies]
bloom-chain-abi = { workspace = true }
bloom-petal-sdk = { workspace = true }
bloom-contract-macros = { workspace = true }
blake3 = { version = "1", default-features = false }

[features]
default = ["std"]
std = ["bloom-chain-abi/std", "blake3/std"]
