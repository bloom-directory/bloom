[package]
name = "bloom-chain-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Accounts trie, per-contract storage, state-blob store for bloom-chain v0"

[dependencies]
bloom-chain-types = { path = "../bloom-chain-types" }
bloom-objects     = { path = "../bloom-objects" }
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
ethereum_ssz = "0.10"
hex.workspace = true
sled = "0.34"

[dev-dependencies]
proptest = "1"
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
