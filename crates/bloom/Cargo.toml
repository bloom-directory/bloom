[package]
name = "bloom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "bloom daemon and CLI"

[[bin]]
name = "bloom"
path = "src/main.rs"

[features]
default = []
# Enable the embedded NFS mount adapter through the daemon crate.
mount = ["bloom-daemon/mount", "dep:bloom-mount"]
# Pass-through for the heimdall-rs decompile decoder. Build with
# `cargo build --features bytecode-decompile` to enable.
bytecode-decompile = ["bloom-daemon/bytecode-decompile"]

[dependencies]
bloom-proto.workspace = true
bloom-auth-api.workspace = true
bloom-daemon.workspace = true
blake3.workspace = true
bloom-mount = { workspace = true, optional = true }
bloom-keystore.workspace = true
bloom-evm.workspace = true
bloom-defi.workspace = true
bloom-tx.workspace = true
url.workspace = true
bloom-vfs.workspace = true
bloom-hyperliquid.workspace = true
bloom-polymarket.workspace = true
bloom-petals.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hex.workspace = true
alloy.workspace = true
base64.workspace = true
qrcode.workspace = true
rand.workspace = true
rpassword.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
async-trait.workspace = true
blake3.workspace = true
