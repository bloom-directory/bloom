[package]
name = "bloom-chain-abi-macros"
version = "0.1.0"
edition = "2024"
description = "Proc-macros for bloom-chain-abi: contract! and events!"
license = "MIT"

[lib]
name = "bloom_chain_abi_macros"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
blake3 = { version = "1" }

[dev-dependencies]
# Tests live in `tests/` and exercise the proc-macro end-to-end. They need
# `bloom-chain-abi` (which re-exports `contract!`), `bloom-petal-sdk` (host
# imports referenced by macro-generated storage/event code), `proptest` for
# fuzz parity, `trybuild` for compile-fail tests, and `blake3` to compute
# expected selectors / topics.
bloom-chain-abi = { workspace = true }
bloom-petal-sdk = { workspace = true }
proptest = "1"
trybuild = "1"
blake3 = "1"
