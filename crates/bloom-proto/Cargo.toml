[package]
name = "bloom-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types and config for bloom"

[features]
default = []
# Fault injection for audit failure-path tests. Never enabled by packaged
# Machine builds.
audit-test-seam = []

[dependencies]
serde.workspace = true
# Audit signatures bind serialized `Value` insertion order. Production builds
# already enabled this transitively; make the compatibility requirement local.
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
thiserror.workspace = true
hex.workspace = true
blake3.workspace = true
humantime-serde.workspace = true
tracing.workspace = true
parking_lot.workspace = true
ed25519-dalek.workspace = true
alloy.workspace = true
dirs.workspace = true
url.workspace = true
fs2.workspace = true

[dev-dependencies]
tempfile.workspace = true
