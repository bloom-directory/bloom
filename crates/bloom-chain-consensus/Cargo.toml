[package]
name = "bloom-chain-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tendermint-style BFT consensus engine for bloom-chain v0"

[dependencies]
bloom-chain-types = { path = "../bloom-chain-types" }
bloom-script.workspace = true
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
ethereum_ssz = "0.10"

[dev-dependencies]
bloom-test-util = { path = "../bloom-test-util" }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "time"] }
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
