[package]
name = "bloom-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daemon library wiring VFS + chain + tx + mount for bloom"

[lib]
doctest = false

[features]
default = ["mount"]
# Forward to bloom-mount/mount: enables `Daemon::mount(path)` and pulls
# in the embednfs server. Portable builds can opt out with
# `--no-default-features`.
mount = ["bloom-mount/mount"]
# Forward to bloom-revert/bytecode-decompile: appends the heimdall-rs
# decompile fallback to the revert-decoder chain. Heavy build (heimdall
# pulls a lot of git deps) so opt-in only.
bytecode-decompile = ["bloom-revert/bytecode-decompile"]
# Explicitly nonproduction constructor seam for external developer harnesses.
# Release packaging must not enable this feature.
unsigned-audit-test-seam = []
triad-dev-harness = ["bloom-machine-client/triad-dev-harness"]

[dependencies]
bloom-proto.workspace = true
bloom-paid-http.workspace = true
bloom-evm.workspace = true
bloom-mempool.workspace = true
bloom-machine-client.workspace = true
bloom-broker-api.workspace = true
bloom-tx.workspace = true
bloom-tools.workspace = true
bloom-vfs.workspace = true
bloom-watch.workspace = true
bloom-mount.workspace = true
bloom-ens.workspace = true
bloom-etherscan.workspace = true
bloom-prices.workspace = true
bloom-revert.workspace = true
bloom-petals.workspace = true
bloom-peer.workspace = true
bloom-update.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
alloy.workspace = true
url.workspace = true
base64.workspace = true
blake3.workspace = true
futures.workspace = true
fs2.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustix.workspace = true
tempfile.workspace = true
uuid.workspace = true
iroh.workspace = true

[dev-dependencies]
bloom-proto = { workspace = true, features = ["audit-test-seam"] }
