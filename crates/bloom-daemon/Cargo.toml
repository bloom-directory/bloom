[package]
name = "bloom-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daemon library wiring VFS + chain + tx + mount for bloom"

[lib]
doctest = false

[features]
default = ["mount"]
# Forward to bloom-mount/mount: enables `Daemon::mount(path)` and pulls
# in the embednfs server. Portable builds can opt out with
# `--no-default-features`.
mount = ["bloom-mount/mount"]
# Forward to bloom-revert/bytecode-decompile: appends the heimdall-rs
# decompile fallback to the revert-decoder chain. Heavy build (heimdall
# pulls a lot of git deps) so opt-in only.
bytecode-decompile = ["bloom-revert/bytecode-decompile"]
# Development-only escape hatch for local testing. This compiles private-key
# loading and approval-bypass paths into the daemon and must remain opt-in.
unsafe-debug-signer = [
    "bloom-keystore/unsafe-debug-signer",
    "bloom-tx/unsafe-debug-signer",
    "bloom-vfs/unsafe-debug-signer",
]

[dependencies]
bloom-auth-api.workspace = true
bloom-auth.workspace = true
bloom-proto.workspace = true
bloom-paid-http.workspace = true
bloom-keystore.workspace = true
bloom-evm.workspace = true
bloom-mempool.workspace = true
bloom-tx.workspace = true
bloom-vfs.workspace = true
bloom-defi.workspace = true
bloom-hyperliquid.workspace = true
bloom-watch.workspace = true
bloom-mount.workspace = true
bloom-ens.workspace = true
bloom-etherscan.workspace = true
bloom-prices.workspace = true
bloom-revert.workspace = true
bloom-petals.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
alloy.workspace = true
axum.workspace = true
url.workspace = true
base64.workspace = true
blake3.workspace = true
rand.workspace = true
futures.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["stream"] }

[dev-dependencies]
tempfile.workspace = true
