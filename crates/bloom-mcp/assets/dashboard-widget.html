<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloom dashboard</title>
  <style id="bloom-styles">
    :root { color-scheme: light dark; }
    body { margin: 0; }
    .widget-status { box-sizing: border-box; padding: 1rem; font: 14px/1.5 system-ui, sans-serif; }
  </style>
  <style id="bloom-host-styles">
    :root {
      --paper: var(--color-background-primary, light-dark(#f4efe6, #181818));
      --surface: var(--color-background-secondary, light-dark(#faf7f1, #242424));
      --tint: var(--color-background-tertiary, light-dark(#eee7dc, #303030));
      --ink: var(--color-text-primary, light-dark(#15130f, #fff));
      --ink-2: var(--color-text-secondary, light-dark(#342d24, #e8e8e8));
      --muted: var(--color-text-secondary, light-dark(#706757, #b8b8b8));
      --rule: var(--color-border-secondary, light-dark(#e2d9cb, #3d3d3d));
      --rule-2: var(--color-border-primary, light-dark(#d5c9b6, #565656));
      --accent: var(--color-text-info, light-dark(#8a2a3a, #83c3ff));
      --accent-deep: var(--color-text-info, light-dark(#5e1a26, #a9d5ff));
      --accent-tint: var(--color-background-info, light-dark(#f1e1e1, #0d273f));
      --accent-rule: var(--color-border-info, light-dark(#c6a5a8, #31577a));
      --success: var(--color-text-success, light-dark(#2e6b34, #6ed49a));
      --success-tint: var(--color-background-success, light-dark(#eeebf1, #173826));
      --success-rule: var(--color-border-success, light-dark(#d4ccdc, #315d43));
      --up: var(--color-text-success, light-dark(#2e6b34, #6ed49a));
      --down: var(--color-text-danger, light-dark(#8a2a3a, #ff8885));
      --pending: var(--color-text-warning, light-dark(#765425, #ffab70));
      --pending-tint: var(--color-background-warning, light-dark(#f6efdf, #422b19));
      --pending-rule: var(--color-border-warning, light-dark(#c9b08a, #765030));
      --radius: var(--border-radius-lg, 14px);
      --radius-sm: var(--border-radius-sm, 8px);
      --serif: var(--font-sans, system-ui, sans-serif);
      --sans: var(--font-sans, system-ui, sans-serif);
      --mono: var(--font-mono, ui-monospace, monospace);
    }
    body.bloom-widget {
      font-size: 13px;
      line-height: 1.45;
    }
    body.bloom-widget > main {
      width: min(1160px, 100%);
      margin: auto;
      padding: 18px;
    }
    .bloom-widget h1 { font-size: 28px; letter-spacing: -.03em; }
    .bloom-widget h2 { font-size: 17px; }
    .bloom-widget h3 { font-size: 14px; }
    .bloom-widget .widget-header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule);
    }
    .bloom-widget .widget-brand {
      display: inline-flex;
      align-items: baseline;
      color: var(--ink);
      font: 600 17px/1 var(--mono);
      letter-spacing: -.06em;
    }
    .bloom-widget .widget-brand-mark {
      margin-right: 1px;
      color: var(--accent);
      font-size: 21px;
      font-weight: 500;
    }
    .bloom-widget .widget-view-title {
      margin: 0;
      color: var(--muted);
      font: 500 11px/1 var(--sans);
      letter-spacing: 0;
    }
    .bloom-widget .widget-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
      padding: 6px 10px;
      border: 1px solid var(--rule-2);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font: 600 10px/1 var(--sans);
      cursor: pointer;
    }
    .bloom-widget .widget-action-icon {
      font-size: 13px;
      line-height: .8;
    }
    .bloom-widget .widget-action:hover,
    .bloom-widget .widget-action:focus-visible {
      border-color: var(--accent);
      color: var(--accent-deep);
      outline: none;
    }
    .bloom-widget .widget-action[aria-busy="true"] { opacity: .55; cursor: progress; }
    .bloom-widget .widget-action + .widget-data-status { margin-left: 0; }
    .bloom-widget .widget-data-status { position: relative; margin: 0 0 0 auto; padding: 0; border: 0; }
    .bloom-widget .widget-data-status > summary {
      display: grid;
      place-items: center;
      width: 28px;
      min-height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      color: var(--muted);
      font: 600 12px/1 var(--sans);
      list-style: none;
    }
    .bloom-widget .widget-data-status > summary::-webkit-details-marker { display: none; }
    .bloom-widget .widget-data-status > summary:hover,
    .bloom-widget .widget-data-status > summary:focus-visible {
      border-color: var(--rule-2);
      color: var(--ink);
      outline: none;
    }
    .bloom-widget .widget-data-panel {
      position: absolute;
      z-index: 2;
      top: 34px;
      right: 0;
      width: min(270px, calc(100vw - 42px));
      padding: 14px;
      border: 1px solid var(--rule-2);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 12px 32px color-mix(in srgb, #000 24%, transparent);
    }
    .bloom-widget .widget-data-panel strong { display: block; margin-bottom: 7px; font-size: 12px; }
    .bloom-widget .widget-data-panel p { margin: 7px 0 0; color: var(--muted); font-size: 10px; }
    .bloom-widget .intro { display: none; }
    .bloom-widget section + section { margin-top: 20px; }
    .bloom-widget .coverage-notice {
      margin: 0 0 10px;
      padding-left: 11px;
      font-size: 10px;
      line-height: 1.4;
    }
    .bloom-widget .coverage-notice::before { top: .5em; width: 5px; height: 5px; }
    .bloom-widget .callout { margin-bottom: 12px; padding: 11px 13px; font-size: 12px; }
    .bloom-widget .callout p { margin-top: 3px; }
    .bloom-widget .widget-callout {
      margin: 0 0 12px;
      padding: 2px 12px;
      border: 0;
      border-left: 3px solid var(--accent);
      background: var(--accent-tint);
    }
    .bloom-widget .widget-callout summary { font-size: 11px; font-weight: 600; }
    .bloom-widget .widget-callout p { margin: 0 0 9px; font-size: 10px; color: var(--muted); }
    .bloom-widget .inventory-summary {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 12px;
      padding: 0 0 16px;
    }
    .bloom-widget .inventory-summary > div:first-child {
      grid-column: 2;
      grid-row: 1;
      padding-bottom: 2px;
      text-align: right;
    }
    .bloom-widget .inventory-summary > div:first-child strong {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }
    .bloom-widget .inventory-value { grid-column: 1; grid-row: 1; text-align: left; }
    .bloom-widget .inventory-value strong { font-size: 30px; font-weight: 600; letter-spacing: -.04em; }
    .bloom-widget .inventory-value span { margin-top: 2px; font-size: 10px; }
    .bloom-widget .directory-note { display: none; }
    .bloom-widget .wallet-directory {
      display: grid;
      gap: 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      overflow: visible;
    }
    .bloom-widget .directory-entry {
      overflow: hidden;
      border: 1px solid var(--rule) !important;
      border-radius: 10px;
      background: var(--surface);
    }
    .bloom-widget .directory-entry > summary.directory-row {
      grid-template-columns: minmax(0, 1fr) auto 12px;
      gap: 10px;
      padding: 13px 14px;
    }
    .bloom-widget .directory-icon { display: none; }
    .bloom-widget .directory-identity { gap: 1px; }
    .bloom-widget .directory-identity > strong { font-size: 15px; }
    .bloom-widget .directory-identity > span { display: none; }
    .bloom-widget .directory-identity .wallet-address { font-size: 10px; }
    .bloom-widget .directory-row .wallet-worth {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      text-align: right;
    }
    .bloom-widget .directory-row .wallet-worth strong { font-size: 16px; }
    .bloom-widget .directory-row .wallet-worth > span { margin: 0; font-size: 9px; }
    .bloom-widget .directory-row::after { grid-column: 3; grid-row: 1; font-size: 17px; }
    .bloom-widget .directory-content {
      margin: 0 14px 14px;
      padding-top: 10px;
    }
    .bloom-widget .directory-content > .wallet-address,
    .bloom-widget .directory-content > .crumbs { display: none; }
    .bloom-widget .directory-content > p { margin-top: 0; font-size: 10px; }
    .bloom-widget .table-wrap { border-bottom: 0; }
    .bloom-widget .holdings-table,
    .bloom-widget .holdings-table tbody { display: block; }
    .bloom-widget .holdings-table caption,
    .bloom-widget .holdings-table thead { display: none; }
    .bloom-widget .holdings-table tr {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) auto;
      align-items: center;
      gap: 8px;
      padding: 9px 0;
      border-top: 1px solid var(--rule);
    }
    .bloom-widget .holdings-table td,
    .bloom-widget .holdings-table td:first-child,
    .bloom-widget .holdings-table td:last-child {
      display: block;
      width: auto;
      min-width: 0;
      padding: 0;
      border: 0;
      text-align: left;
      font-size: 12px;
    }
    .bloom-widget .holdings-table td::before { display: none; }
    .bloom-widget .holdings-table td:last-child { text-align: right; white-space: nowrap; }
    .bloom-widget .holdings-table .asset-label { gap: 7px; }
    .bloom-widget .holdings-table .asset-mark { width: 22px; height: 22px; flex-basis: 22px; }
    .bloom-widget .holdings-table .asset-label strong { font-size: 12px; line-height: 1.25; }
    .bloom-widget .holdings-table .asset-label small { margin: 1px 0 0; font-size: 9px; }
    .bloom-widget .holding-network { display: block; }
    .bloom-widget .holding-account {
      display: block;
      margin-top: 1px;
      color: var(--accent-deep);
      font: 500 8px/1.25 var(--sans);
      white-space: nowrap;
    }
    .bloom-widget details > summary { min-height: 34px; padding: 7px 0; }
    .bloom-widget .wallet-subsection { margin-top: 12px; }
    .bloom-widget .wallet-subsection .section-head { margin-bottom: 6px; }
    .bloom-widget .position-list .app-position { gap: 8px 12px; padding: 12px 0; }
    .bloom-widget .app-identity { gap: 9px; }
    .bloom-widget .app-identity > .asset-mark,
    .bloom-widget .app-identity > .monogram { width: 28px; height: 28px; }
    .bloom-widget .app-name { font-size: 14px; }
    .bloom-widget .app-identity small { margin-top: 1px; font-size: 10px; }
    .bloom-widget .app-value { font-size: 15px; }
    .bloom-widget .position-list .app-position .position-evidence { margin-left: 37px; font-size: 10px; }
    .bloom-widget .historical-disclosure {
      margin-top: 22px;
      border-top: 1px solid var(--rule);
    }
    .bloom-widget .historical-disclosure > summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2px 10px;
      min-height: 0;
      padding: 12px 0;
      list-style: none;
      cursor: pointer;
    }
    .bloom-widget .historical-disclosure > summary::-webkit-details-marker { display: none; }
    .bloom-widget .historical-disclosure > summary::after {
      content: "+";
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: center;
      color: var(--accent);
      font-size: 17px;
    }
    .bloom-widget .historical-disclosure[open] > summary::after { content: "−"; }
    .bloom-widget .historical-disclosure-title { font-size: 13px; font-weight: 600; }
    .bloom-widget .historical-disclosure-note { color: var(--muted); font-size: 9px; }
    .bloom-widget .historical-disclosure-content { padding-bottom: 8px; }

    /* Policy reads as rules first; evidence is available on demand. */
    .bloom-widget .policy-wallet {
      margin: 8px 0;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--surface);
      overflow: hidden;
    }
    .bloom-widget .policy-wallet > summary {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr) auto 10px;
      align-items: center;
      gap: 2px 8px;
      min-height: 0;
      padding: 12px;
      list-style: none;
      cursor: pointer;
    }
    .bloom-widget .policy-wallet > summary::-webkit-details-marker { display: none; }
    .bloom-widget .policy-wallet > summary::after {
      content: "+";
      color: var(--accent);
      font-size: 16px;
    }
    .bloom-widget .policy-wallet[open] > summary::after { content: "−"; }
    .bloom-widget .policy-wallet-icon {
      grid-row: 1 / span 2;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-tint);
      font-size: 13px;
    }
    .bloom-widget .policy-wallet-name { font-size: 14px; font-weight: 650; }
    .bloom-widget .policy-wallet-version { grid-column: 2; color: var(--muted); font-size: 9px; }
    .bloom-widget .policy-wallet-count {
      grid-column: 3;
      grid-row: 1 / span 2;
      color: var(--muted);
      font-size: 9px;
      text-align: right;
    }
    .bloom-widget .policy-wallet-body {
      padding: 0 12px 12px;
      border-top: 1px solid var(--rule);
    }
    .bloom-widget .policy-verdict {
      display: flex;
      gap: 7px;
      margin: 0;
      padding: 10px 0;
      color: var(--ink-2);
      font-size: 10px;
      line-height: 1.4;
    }
    .bloom-widget .policy-verdict-icon { flex: 0 0 auto; font-size: 13px; }
    .bloom-widget .policy-rules {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-block: 1px solid var(--rule);
    }
    .bloom-widget .policy-rule {
      min-width: 0;
      padding: 9px 7px;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .bloom-widget .policy-rule:nth-child(2n) { border-right: 0; }
    .bloom-widget .policy-rule:nth-last-child(-n + 2) { border-bottom: 0; }
    .bloom-widget .policy-rule-label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 8px;
    }
    .bloom-widget .policy-rule-value {
      display: block;
      margin-top: 3px;
      color: var(--ink);
      font-size: 11px;
      line-height: 1.25;
    }
    .bloom-widget .policy-destinations,
    .bloom-widget .policy-safeguards { margin-top: 9px; }
    .bloom-widget .policy-destinations > summary,
    .bloom-widget .policy-safeguards > summary {
      min-height: 0;
      padding: 5px 0;
      color: var(--ink-2);
      font-size: 10px;
      font-weight: 600;
    }
    .bloom-widget .policy-exceptions { gap: 5px; margin-top: 5px; }
    .bloom-widget .policy-exception {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2px 8px;
      padding: 8px 9px;
      border-radius: 7px;
      background: var(--paper);
    }
    .bloom-widget .policy-exception > div { display: block; }
    .bloom-widget .policy-exception .badge { display: none; }
    .bloom-widget .policy-exception .asset-label { gap: 5px; font-size: 9px; }
    .bloom-widget .policy-exception .asset-mark { width: 15px; height: 15px; flex-basis: 15px; }
    .bloom-widget .policy-exception h3 { grid-column: 2; grid-row: 1; margin: 0; font-size: 9px; font-weight: 600; }
    .bloom-widget .policy-exception code {
      grid-column: 1 / -1;
      overflow: hidden;
      color: var(--muted);
      font-size: 8px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bloom-widget .policy-safeguards p { margin: 3px 0 0; color: var(--muted); font-size: 9px; }

    /* Network comparison keeps one primary and two secondary metrics per row. */
    .bloom-widget .network-list { margin-top: 0; }
    .bloom-widget .network-columns {
      display: flex;
      gap: 4px;
      margin-bottom: 5px;
      padding: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .bloom-widget .network-columns::-webkit-scrollbar { display: none; }
    .bloom-widget .network-columns button,
    .bloom-widget .network-columns button:not(:first-child) {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      text-align: left;
      font-size: 8px;
      line-height: 1;
    }
    .bloom-widget .network-columns button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-tint);
    }
    .bloom-widget .sort-status { display: none; }
    .bloom-widget .network-row { border-bottom: 1px solid var(--rule); }
    .bloom-widget .network-row[open] { border-radius: 0; background: transparent; }
    .bloom-widget .network-row > summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 10px;
      min-height: 0;
      padding: 10px 2px;
      border-radius: 0;
    }
    .bloom-widget .network-name { grid-column: 1; grid-row: 1; }
    .bloom-widget .network-name .asset-label { gap: 7px; font-size: 11px; }
    .bloom-widget .network-name .asset-mark { width: 22px; height: 22px; flex-basis: 22px; }
    .bloom-widget .network-name::before { font-size: 12px; }
    .bloom-widget .network-number {
      min-width: 0;
      padding: 0;
      text-align: right;
      font-size: 9px;
      white-space: nowrap;
    }
    .bloom-widget .network-number > small { display: inline; margin-right: 3px; font-size: 7px; }
    .bloom-widget .network-number:nth-of-type(2) { grid-column: 2; grid-row: 1; }
    .bloom-widget .network-number:nth-of-type(3) { grid-column: 1; grid-row: 2; text-align: left; }
    .bloom-widget .network-number:nth-of-type(4) { grid-column: 2; grid-row: 2; }
    .bloom-widget .network-number strong { font-size: 11px; }
    .bloom-widget .network-context { margin: 0; padding: 8px 2px; font-size: 8px; }
    .bloom-widget .network-detail { padding: 9px 2px 12px; }

    /* Markets read as dense quotes, not full dashboard tiles. */
    .bloom-widget .markets-heading { margin: 0 0 5px; }
    .bloom-widget .markets-heading h2 { font-size: 13px; }
    .bloom-widget .markets-heading p { font-size: 8px; }
    .bloom-widget .mover-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      margin: 0 0 14px;
      border-block: 1px solid var(--rule);
    }
    .bloom-widget .mover-tile {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1px 8px;
      padding: 8px 2px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
    }
    .bloom-widget .mover-tile:last-child { border-bottom: 0; }
    .bloom-widget .mover-tile h3 { margin: 0; font-size: 11px; }
    .bloom-widget .mover-tile .asset-label { gap: 7px; }
    .bloom-widget .mover-tile .asset-mark { width: 22px; height: 22px; flex-basis: 22px; }
    .bloom-widget .mover-tile > strong {
      grid-column: 2;
      grid-row: 1 / span 2;
      margin: 0;
      font-size: 17px;
    }
    .bloom-widget .mover-tile small { grid-column: 1; margin-left: 29px; font-size: 8px; }
    .bloom-widget .market-table,
    .bloom-widget .market-table tbody { display: block; }
    .bloom-widget .market-table thead { display: none; }
    .bloom-widget .market-table tr {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 2px 9px;
      padding: 9px 2px;
      border-top: 1px solid var(--rule);
    }
    .bloom-widget .market-table td,
    .bloom-widget .market-table td:first-child,
    .bloom-widget .market-table td:last-child {
      display: block;
      width: auto !important;
      min-width: 0;
      padding: 0;
      border: 0;
      text-align: right;
      font-size: 10px;
    }
    .bloom-widget .market-table td::before { display: none; }
    .bloom-widget .market-table td:first-child {
      grid-column: 1;
      grid-row: 1 / span 2;
      text-align: left;
    }
    .bloom-widget .market-table td:nth-child(2) { grid-column: 2; grid-row: 1; }
    .bloom-widget .market-table td:nth-child(3) { grid-column: 3; grid-row: 1; }
    .bloom-widget .market-table td:nth-child(4) {
      grid-column: 2 / span 2;
      grid-row: 2;
      color: var(--muted);
      font-size: 8px;
    }
    .bloom-widget .market-table td:nth-child(4)::before { display: inline; content: "Vol "; }
    .bloom-widget .market-table .asset-label { gap: 7px; }
    .bloom-widget .market-table .asset-mark { width: 23px; height: 23px; flex-basis: 23px; }
    .bloom-widget .market-table .asset-label strong { font-size: 10px; }
    .bloom-widget .market-table .asset-label small { margin-top: 0; font-size: 8px; }

    /* Activity is a ledger, not a stack of dashboard cards. */
    .bloom-widget .outcome-overview {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      margin: 0 0 12px;
      border-block: 1px solid var(--rule);
    }
    .bloom-widget .outcome-overview > a {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1px 6px;
      align-items: baseline;
      padding: 9px 8px;
      border: 0;
      border-right: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
    }
    .bloom-widget .outcome-overview > a:last-child { border-right: 0; }
    .bloom-widget .outcome-overview .mini-outcome { display: none; }

      display: flex;

      justify-content: space-between;
      margin: 0 0 5px;
    }
    .bloom-widget .activity-index h2 { margin: 0; font-size: 12px; }
    .bloom-widget .activity-index p { margin: 0; color: var(--muted); font-size: 9px; }
    .bloom-widget .activity-day {
      margin: 11px 0 2px;

      border-bottom: 1px solid var(--rule);
    }
    .bloom-widget .activity-day h3 { margin: 0; color: var(--muted); font-size: 10px; font-weight: 600; }
    .bloom-widget .activity-ledger { border: 0; border-radius: 0; background: transparent; }
    .bloom-widget .activity-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 7px;
      padding: 9px 2px;
      border: 0;

    }
    .bloom-widget .activity-row.status-failed,
    .bloom-widget .activity-row.status-pending { border-left: 0; }
    .bloom-widget .outcome-symbol {

    .bloom-widget .activity-description > details { display: inline-block; margin: 3px 10px 0 0; }
    .bloom-widget .activity-description > details > summary {
      min-height: 0;
      padding: 2px 0;

    }
    .bloom-widget .activity-description > details > dl { margin-top: 6px; }
    .bloom-widget .activity-outcome { display: none; }

    /* Contacts prioritize people and frequency; raw evidence stays disclosed. */
    .bloom-widget .contacts-section { margin-top: 0; }
    .bloom-widget .contacts-section + .contacts-section { margin-top: 14px; }
    .bloom-widget .contacts-section > .section-head { margin-bottom: 3px; }
    .bloom-widget .contacts-section > .section-head h2 { margin: 0; font-size: 13px; }
    .bloom-widget .contacts-section > .section-head p { margin: 0; font-size: 9px; }
    .bloom-widget .contact-list { border-block: 1px solid var(--rule); }
    .bloom-widget .contact-row {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2px 10px;
      padding: 10px 0;
    }
    .bloom-widget .contact-row .badge { display: none; }
    .bloom-widget .contact-row h3 { margin: 0; font: 600 12px/1.3 var(--mono); }
    .bloom-widget .contact-row p { margin: 1px 0 0; font-size: 9px; }
    .bloom-widget .contact-stats {
      display: flex;
      align-items: baseline;
      gap: 3px;
      text-align: right;
      white-space: nowrap;
    }
    .bloom-widget .contact-stats span { font-size: 9px; }
    .bloom-widget .contact-stats span:first-child { color: var(--ink); font-size: 10px; font-weight: 600; }
    .bloom-widget .contact-row details { margin-top: 2px; }
    .bloom-widget .contact-row details > summary { min-height: 0; padding: 2px 0; font-size: 9px; }
    .bloom-widget .contact-row code { font-size: 9px; }
    .bloom-widget .contacts-secondary { margin-top: 10px; }
    .bloom-widget .contacts-secondary > summary { min-height: 30px; padding: 5px 0; font-size: 10px; }

    /* Receive presents one scannable address at a time. */
    .bloom-widget .receiving-wallet {
      margin: 7px 0;
      border-radius: 10px;
    }
    .bloom-widget .receiving-wallet > summary { gap: 8px; min-height: 0; padding: 11px 12px; }
    .bloom-widget .receiving-wallet > summary::after { font-size: 17px; }
    .bloom-widget .wallet-identity strong { font-size: 13px; }
    .bloom-widget .wallet-identity small { margin-top: 0; font-size: 9px; }
    .bloom-widget .wallet-count { margin-left: auto; font-size: 9px; }
    .bloom-widget .receiving-wallet .grid {
      display: block;
      margin: 0;
      padding: 10px 12px 13px;
      background: transparent;
    }
    .bloom-widget .receive-address-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 10px;
    }
    .bloom-widget .receive-address-tab {
      min-width: 0;
      padding: 5px 8px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font: 500 9px/1 var(--sans);
      cursor: pointer;
      white-space: nowrap;
    }
    .bloom-widget .receive-address-tab[aria-selected="true"] {
      border-color: var(--accent);
      color: var(--accent-deep);
      background: var(--accent-tint);
    }
    .bloom-widget .receiving-card {
      display: flex;
      align-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      text-align: center;
    }
    .bloom-widget .receiving-card[hidden] { display: none; }
    .bloom-widget .receiving-card > h3 { margin: 0 0 8px; font-size: 12px; }
    .bloom-widget .receiving-card .asset-mark { width: 18px; height: 18px; flex-basis: 18px; }
    .bloom-widget .receiving-qr { margin: 0; }
    .bloom-widget .receiving-qr > div { padding: 9px; border: 0; border-radius: 10px; }
    .bloom-widget .receiving-qr svg,
    .bloom-widget .receiving-qr img { width: min(158px, 62vw); }
    .bloom-widget .receive-address-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      width: min(250px, 100%);
      margin-top: 9px;
    }
    .bloom-widget .receive-address-line .address {
      min-width: 0;
      padding: 7px 8px;
      border-radius: 7px;
      background: var(--paper);
      font-size: 9px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .bloom-widget .copy-address {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--rule-2);
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      font: 600 8px/1 var(--sans);
      cursor: pointer;
    }
    .bloom-widget .receiving-network,
    .bloom-widget .receiving-network-list,
    .bloom-widget .receiving-card > .external-link { display: none; }
    .bloom-widget .checkout-probe {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px 10px;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--rule-2);
      font-size: 10px;
    }
    .bloom-widget .checkout-probe strong { font-size: 11px; }
    .bloom-widget .checkout-probe-status {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--muted);
      line-height: 1.4;
    }
    .bloom-widget .checkout-probe button {
      padding: 5px 8px;
      border: 1px solid var(--rule-2);
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      font: 600 9px/1 var(--sans);
      cursor: pointer;
    }
    @media (max-width: 420px) {
      body.bloom-widget > main { padding: 15px 13px; }
      .bloom-widget .directory-row .wallet-worth > span { display: none; }
    }
  </style>
  <style id="bloom-skin-styles"></style>
</head>
<body class="bloom-widget"><p class="widget-status">Loading Bloom…</p>
<script>
(() => {
  "use strict";

  const pending = new Map();
  const appliedHostVariables = new Set();
  const callableViewTools = new Set(["show_bloom_wallets", "show_bloom_receive"]);
  const checkoutProbeOrigin = "http://localhost:48763";
  const viewResultCache = new Map();
  let nextId = 0;
  let hostContext = {};

  const send = (method, params) => {
    const id = nextId++;
    parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  };
  const notify = (method, params) => {
    const message = { jsonrpc: "2.0", method };
    if (params !== undefined) message.params = params;
    parent.postMessage(message, "*");
  };
  const answer = (id, result) => parent.postMessage({ jsonrpc: "2.0", id, result }, "*");

  const setTheme = (context) => {
    const update = context || {};
    hostContext = {
      ...hostContext,
      ...update,
      styles: {
        ...(hostContext.styles || {}),
        ...(update.styles || {}),
        variables: {
          ...(hostContext.styles?.variables || {}),
          ...(update.styles?.variables || {}),
        },
      },
    };
    const variables = hostContext.styles.variables;
    for (const name of appliedHostVariables) {
      if (!(name in variables)) document.documentElement.style.removeProperty(name);
    }
    appliedHostVariables.clear();
    for (const [name, value] of Object.entries(variables)) {
      if (!name.startsWith("--") || typeof value !== "string") continue;
      document.documentElement.style.setProperty(name, value);
      appliedHostVariables.add(name);
    }
    document.documentElement.dataset.theme = hostContext.theme || "light";
    document.documentElement.style.colorScheme = hostContext.theme || "light";
  };

  const reportSize = () => notify("ui/notifications/size-changed", {
    width: Math.ceil(document.documentElement.scrollWidth),
    height: Math.ceil(document.documentElement.scrollHeight),
  });

  const enableNetworksSorting = () => {
    const list = document.querySelector("[data-network-list]");
    if (!list) return;
    const rows = list.querySelector("[data-network-rows]");
    const buttons = [...list.querySelectorAll("button[data-sort]")];
    const status = list.querySelector(".sort-status");
    const labels = { name: "Network", "fees-all": "Fees · all time", "fees-day": "Fees · 24h", "dex-day": "DEX volume · 24h" };
    buttons.forEach((button) => button.addEventListener("click", () => {
      const key = button.dataset.sort;
      const direction = button.getAttribute("aria-pressed") === "true" && button.dataset.direction === "desc" ? "asc" : "desc";
      const dataKey = key.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase());
      const items = [...rows.querySelectorAll(".network-row")];
      items.sort((leftRow, rightRow) => {
        let comparison;
        if (key === "name") comparison = leftRow.dataset.name.localeCompare(rightRow.dataset.name);
        else {
          const left = leftRow.dataset[dataKey];
          const right = rightRow.dataset[dataKey];
          if (left === "" && right !== "") return 1;
          if (right === "" && left !== "") return -1;
          comparison = left === "" ? 0 : Number(left) - Number(right);
        }
        if (comparison === 0) comparison = leftRow.dataset.name.localeCompare(rightRow.dataset.name);
        return direction === "asc" ? comparison : -comparison;
      });
      items.forEach((item) => rows.append(item));
      buttons.forEach((candidate) => {
        const active = candidate.dataset.sort === key;
        candidate.setAttribute("aria-pressed", String(active));
        candidate.dataset.direction = active ? direction : "";
        candidate.querySelector("span").textContent = active ? (direction === "asc" ? "↑" : "↓") : "↕";
      });
      if (status) status.textContent = `Sorted by ${labels[key]}, ${direction === "asc" ? "ascending" : "descending"}.`;
      reportSize();
    }));
  };

  const selectReceiveWallet = (hash) => {
    const match = hash.match(/^#wallet-(.+)$/);
    if (!match) return;
    const wallet = document.getElementById(`wallet-${match[1]}`);
    if (wallet?.matches("details.receiving-wallet")) wallet.open = true;
  };

  const noticeText = (notice) => {
    const headingNode = notice.querySelector("summary, strong");
    const heading = headingNode?.textContent?.trim() || "About this data";
    const items = [...notice.querySelectorAll(":scope > p, :scope > ul > li")]
      .map((item) => item.textContent.trim())
      .filter(Boolean);
    let detail = items.join(" ");
    if (!detail) {
      detail = notice.textContent.trim();
      if (detail.startsWith(heading)) detail = detail.slice(heading.length).trim();
    }
    return detail ? `${heading} — ${detail}` : heading;
  };

  const addDataStatus = (page, header, notices) => {
    const details = notices.map(noticeText).filter(Boolean);
    notices.forEach((notice) => notice.remove());
    if (!details.length) return;
    const status = page.createElement("details");
    status.className = "widget-data-status";
    const summary = page.createElement("summary");
    summary.textContent = "i";
    summary.title = "Data details";
    summary.setAttribute("aria-label", "Data details");
    const panel = page.createElement("div");
    panel.className = "widget-data-panel";
    const panelTitle = page.createElement("strong");
    panelTitle.textContent = "About this data";
    panel.append(panelTitle);
    for (const detail of details) {
      const paragraph = page.createElement("p");
      paragraph.textContent = detail;
      panel.append(paragraph);
    }
    status.append(summary, panel);
    header.append(status);
  };

  const prepareActivity = (main) => {
    const overviewLabels = ["Sent", "Review", "Stopped"];
    [...main.querySelectorAll(".outcome-overview > a > span:last-child")]
      .forEach((label, index) => { if (overviewLabels[index]) label.textContent = overviewLabels[index]; });
    const index = main.querySelector(".section-head#ledger");
    if (index) index.classList.add("activity-index");
    for (const day of main.querySelectorAll(".activity-ledger > .section-head")) day.classList.add("activity-day");
    for (const meta of main.querySelectorAll(".activity-meta")) {
      for (const item of [...meta.children]) {
        const text = item.textContent.trim();
        if (/^(evm|solana)-wallet$/i.test(text) || /^petal[:-]/i.test(text)) item.remove();
        else if (/^\d{1,2} \w{3} \d{4} · /.test(text)) item.textContent = text.replace(/^\d{1,2} \w{3} \d{4} · /, "");
      }
    }
  };

  const prepareContacts = (main) => {
    for (const section of main.querySelectorAll(":scope > section")) {
      const heading = section.querySelector(":scope > .section-head h2")?.textContent?.trim();
      if (!heading) continue;
      if (heading === "Saved contacts" && section.querySelector(".empty-state")) {
        section.remove();
        continue;
      }
      section.classList.add("contacts-section");
    }
    for (const stats of main.querySelectorAll(".contact-stats")) {
      const values = [...stats.querySelectorAll("span")];
      if (values[0]) values[0].textContent = `${values[0].textContent.trim()} ·`;
      if (values[1]) values[1].textContent = values[1].textContent.trim().replace(/^(\d{1,2} \w{3}).*$/, "$1");
    }
    for (const details of main.querySelectorAll(":scope > details")) details.classList.add("contacts-secondary");
  };

  const accountNumberFromPath = (path) => {
    const evm = path.match(/^m\/44'\/60'\/\d+'\/\d+\/(\d+)$/);
    if (evm) return Number(evm[1]) + 1;
    const solana = path.match(/^m\/44'\/501'\/(\d+)'/);
    if (solana) return Number(solana[1]) + 1;
    return 1;
  };

  const prepareReceive = (page, main) => {
    const wallets = [...main.querySelectorAll(".receiving-wallet")];
    const preferredWallet = wallets.find((wallet) => wallet.id === "wallet-main") || wallets[0];
    if (preferredWallet) preferredWallet.open = true;
    for (const wallet of wallets) {
      const grid = wallet.querySelector(":scope > .grid");
      if (!grid) continue;
      grid.querySelectorAll(".receiving-unavailable").forEach((card) => card.remove());
      const cards = [...grid.querySelectorAll(":scope > .receiving-card")].filter((card) => card.querySelector(".address"));
      if (!cards.length) continue;
      cards.sort((left, right) => {
        const leftFamily = left.querySelector("h3")?.textContent?.includes("Solana") ? 1 : 0;
        const rightFamily = right.querySelector("h3")?.textContent?.includes("Solana") ? 1 : 0;
        if (leftFamily !== rightFamily) return leftFamily - rightFamily;
        const leftPath = left.querySelector(".receiving-network code")?.textContent?.trim() || "";
        const rightPath = right.querySelector(".receiving-network code")?.textContent?.trim() || "";
        return accountNumberFromPath(leftPath) - accountNumberFromPath(rightPath);
      });
      cards.forEach((card) => grid.append(card));
      const tabs = page.createElement("div");
      tabs.className = "receive-address-tabs";
      tabs.setAttribute("role", "tablist");
      cards.forEach((card, index) => {
        const address = card.querySelector(".address");
        const family = card.querySelector("h3")?.textContent?.trim() || `Address ${index + 1}`;
        const path = card.querySelector(".receiving-network code")?.textContent?.trim() || "";
        const accountNumber = accountNumberFromPath(path);
        const accountLabel = accountNumber === 1 ? "Primary" : `Account ${accountNumber}`;
        const suffix = address.textContent.trim().slice(-4);
        const id = `${wallet.id}-address-${index}`;
        card.id = id;
        card.hidden = index !== 0;
        const button = page.createElement("button");
        button.type = "button";
        button.className = "receive-address-tab";
        button.dataset.receiveTarget = id;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-controls", id);
        button.setAttribute("aria-selected", String(index === 0));
        button.textContent = `${family.replace("Ethereum & EVM", "EVM").replace("Solana", "SOL")} · ${accountLabel}`;
        button.title = `${family}, ${accountLabel}, address ending ${suffix}${path ? ` · ${path}` : ""}`;
        tabs.append(button);

        const line = page.createElement("div");
        line.className = "receive-address-line";
        const copy = page.createElement("button");
        copy.type = "button";
        copy.className = "copy-address";
        copy.dataset.copyAddress = address.textContent.trim();
        copy.textContent = "Copy";
        address.replaceWith(line);
        line.append(address, copy);
      });
      grid.prepend(tabs);
    }
  };

  const prepareHoldingAccounts = (page, main) => {
    for (const table of main.querySelectorAll(".holdings-table")) {
      const rows = [...table.querySelectorAll("tbody tr")].map((row) => {
        const label = row.querySelector("td:nth-child(2) .asset-label > span");
        if (!label) return null;
        const full = label.textContent.trim();
        const separator = full.indexOf(" · ");
        return {
          label,
          network: separator < 0 ? full : full.slice(0, separator),
          path: separator < 0 ? "" : full.slice(separator + 3),
        };
      }).filter(Boolean);
      const counts = new Map();
      for (const row of rows) counts.set(row.network, (counts.get(row.network) || 0) + 1);
      for (const row of rows) {
        row.label.title = row.path ? `${row.network} · ${row.path}` : row.network;
        const network = page.createElement("span");
        network.className = "holding-network";
        network.textContent = row.network;
        row.label.replaceChildren(network);
        if ((counts.get(row.network) || 0) < 2) continue;
        const accountNumber = accountNumberFromPath(row.path);
        const account = page.createElement("small");
        account.className = "holding-account";
        account.textContent = accountNumber === 1 ? "Primary account" : `Account ${accountNumber}`;
        row.label.append(account);
      }
    }
  };

  const prepareHistoricalAccounts = (page, main) => {
    const section = main.querySelector(":scope > .historical-accounts");
    if (!section) return;
    const heading = section.querySelector(":scope > .section-head");
    const entries = [...section.querySelectorAll(":scope > .historical-account")];
    const disclosure = page.createElement("details");
    disclosure.className = "historical-disclosure";
    const summary = page.createElement("summary");
    const title = page.createElement("span");
    title.className = "historical-disclosure-title";
    title.textContent = `Historical accounts · ${entries.length}`;
    const note = page.createElement("span");
    note.className = "historical-disclosure-note";
    note.textContent = heading?.querySelector("p")?.textContent?.trim() || "Not connected to a current wallet";
    summary.append(title, note);
    const content = page.createElement("div");
    content.className = "historical-disclosure-content";
    for (const child of [...section.children]) {
      if (child !== heading) content.append(child);
    }
    disclosure.append(summary, content);
    section.replaceWith(disclosure);
  };

  const preparePolicy = (page, main) => {
    const icons = {
      "Where it may send": "📍",
      "Allowed app": "🧩",
      "Amount cap": "💰",
      "Approval window": "⏱",
    };
    const sections = [...main.querySelectorAll(":scope > section[id^='wallet-']")];
    for (const section of sections) {
      const head = section.querySelector(":scope > .section-head");
      const name = head?.querySelector("h2")?.textContent?.trim() || "Wallet";
      const version = head?.querySelector("p")?.textContent?.trim() || "Policy";
      const exceptions = section.querySelector(":scope > .policy-exceptions");
      const destinationCount = exceptions?.querySelectorAll(".policy-exception").length || 0;
      const sourceSummary = section.querySelector(":scope > .policy-summary");
      const sourceLimits = section.querySelector(":scope > .policy-limits");
      const sourcePlain = section.querySelector(":scope > .policy-plain");

      const wallet = page.createElement("details");
      wallet.className = "policy-wallet";
      wallet.setAttribute("name", "policy-wallet");
      wallet.open = name === "main" || (sections.length === 1);
      const summary = page.createElement("summary");
      const shield = page.createElement("span");
      shield.className = "policy-wallet-icon";
      shield.setAttribute("aria-hidden", "true");
      shield.textContent = "🛡️";
      const walletName = page.createElement("span");
      walletName.className = "policy-wallet-name";
      walletName.textContent = name;
      const walletVersion = page.createElement("span");
      walletVersion.className = "policy-wallet-version";
      walletVersion.textContent = version;
      const count = page.createElement("span");
      count.className = "policy-wallet-count";
      count.textContent = destinationCount === 1 ? "1 destination" : `${destinationCount} destinations`;
      summary.append(shield, walletName, walletVersion, count);

      const body = page.createElement("div");
      body.className = "policy-wallet-body";
      const verdict = page.createElement("p");
      verdict.className = "policy-verdict";
      const verdictIcon = page.createElement("span");
      verdictIcon.className = "policy-verdict-icon";
      verdictIcon.setAttribute("aria-hidden", "true");
      verdictIcon.textContent = destinationCount ? "✅" : "⛔";
      const verdictText = page.createElement("span");
      verdictText.textContent = destinationCount
        ? "A transfer can proceed only when every rule below matches; approval is still required."
        : "Sending is blocked because this policy lists no destination."
      verdict.append(verdictIcon, verdictText);
      body.append(verdict);

      if (sourceLimits) {
        const rules = page.createElement("div");
        rules.className = "policy-rules";
        for (const item of sourceLimits.querySelectorAll(":scope > div")) {
          const labelText = item.querySelector("dt")?.textContent?.trim() || "Rule";
          let valueText = item.querySelector("dd")?.textContent?.trim() || "Not specified";
          if (labelText === "Amount cap" && valueText === "None expressed here") valueText = "Not specified";
          const rule = page.createElement("div");
          rule.className = "policy-rule";
          const label = page.createElement("span");
          label.className = "policy-rule-label";
          label.textContent = `${icons[labelText] || "•"} ${labelText}`;
          const value = page.createElement("strong");
          value.className = "policy-rule-value";
          value.textContent = valueText;
          rule.append(label, value);
          rules.append(rule);
        }
        body.append(rules);
      }

      if (exceptions) {
        const destinations = page.createElement("details");
        destinations.className = "policy-destinations";
        const destinationSummary = page.createElement("summary");
        destinationSummary.textContent = `📍 ${destinationCount} allowed ${destinationCount === 1 ? "destination" : "destinations"}`;
        destinations.append(destinationSummary, exceptions);
        body.append(destinations);
      }
      if (sourcePlain) {
        const safeguards = page.createElement("details");
        safeguards.className = "policy-safeguards";
        const safeguardSummary = page.createElement("summary");
        safeguardSummary.textContent = "🔒 Other safeguards";
        safeguards.append(safeguardSummary, sourcePlain);
        body.append(safeguards);
      }
      sourceSummary?.remove();
      head?.remove();
      sourceLimits?.remove();
      wallet.append(summary, body);
      section.replaceWith(wallet);
    }
  };

  const prepareNetworks = (page, main) => {
    const labels = ["Name", "All-time", "24h fees", "DEX 24h"];
    [...main.querySelectorAll(".network-columns button")].forEach((button, index) => {
      const arrow = button.querySelector("span")?.textContent || "";
      button.replaceChildren(`${labels[index] || button.textContent.trim()} `);
      const indicator = page.createElement("span");
      indicator.setAttribute("aria-hidden", "true");
      indicator.textContent = arrow;
      button.append(indicator);
    });
    for (const number of main.querySelectorAll(".network-number small")) {
      number.textContent = number.textContent
        .replace("All-time fees", "All")
        .replace("24h fees", "24h")
        .replace("24h DEX volume", "DEX");
    }
  };

  const prepareMarkets = (main) => {
    for (const heading of main.querySelectorAll(":scope > .section-head")) heading.classList.add("markets-heading");
  };

  const addCheckoutProbe = (page, main) => {
    const probe = page.createElement("section");
    probe.className = "checkout-probe";
    const title = page.createElement("strong");
    title.textContent = "Embedded checkout test";
    const button = page.createElement("button");
    button.type = "button";
    button.dataset.checkoutProbe = "";
    button.textContent = "Retry";
    const status = page.createElement("p");
    status.className = "checkout-probe-status";
    status.textContent = "Checking WebAuthn iframe delegation…";
    probe.append(title, button, status);
    main.append(probe);
  };

  const webAuthnAllowed = (targetDocument) => {
    const policy = targetDocument.permissionsPolicy || targetDocument.featurePolicy;
    if (!policy?.allowsFeature) return null;
    try { return policy.allowsFeature("publickey-credentials-get"); }
    catch { return null; }
  };

  const enableCheckoutProbe = () => {
    const button = document.querySelector("button[data-checkout-probe]");
    const status = document.querySelector(".checkout-probe-status");
    if (!button || !status) return;
    const run = () => {
      status.textContent = "Checking WebAuthn iframe delegation…";
      const outer = webAuthnAllowed(document);
      const frame = document.createElement("iframe");
      let finished = false;
      const finish = (message) => {
        if (finished) return;
        finished = true;
        removeEventListener("message", receiveProbeResult);
        frame.remove();
        status.textContent = message;
        reportSize();
      };
      const receiveProbeResult = (event) => {
        if (event.source !== frame.contentWindow || event.origin !== checkoutProbeOrigin) return;
        if (event.data?.type !== "bloom-webauthn-probe") return;
        const { available, allowed, secureContext } = event.data;
        if (!secureContext) finish("Blocked: the localhost checkout is not a secure context.");
        else if (!available) finish("Unavailable: the localhost frame has no WebAuthn API.");
        else if (outer === false) finish("Blocked: the host does not delegate WebAuthn to Bloom.");
        else if (allowed === false) finish("Blocked: WebAuthn does not reach the localhost checkout frame.");
        else if (outer === true && allowed === true) finish("Passed: WebAuthn reaches a cross-origin localhost checkout.");
        else finish("Inconclusive: this host does not expose Permissions Policy inspection.");
      };
      frame.hidden = true;
      frame.title = "WebAuthn permission probe";
      frame.sandbox = "allow-scripts allow-same-origin";
      frame.allow = "publickey-credentials-get *";
      frame.src = `${checkoutProbeOrigin}/probe`;
      addEventListener("message", receiveProbeResult);
      document.body.append(frame);
      setTimeout(() => finish(outer === false
        ? "Blocked: the host does not delegate WebAuthn to Bloom."
        : "Blocked: the host did not load the localhost checkout frame."), 2000);
    };
    button.addEventListener("click", run);
    run();
  };

  const addViewAction = (page, header, title) => {
    const destinations = {
      Wallets: ["show_bloom_receive", "Receive", "↓"],
      Receive: ["show_bloom_wallets", "Wallets", "←"],
    };
    const destination = destinations[title];
    if (!destination) return;
    const button = page.createElement("button");
    button.type = "button";
    button.className = "widget-action";
    button.dataset.viewTool = destination[0];
    const icon = page.createElement("span");
    icon.className = "widget-action-icon";
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = destination[2];
    button.append(icon, destination[1]);
    header.append(button);
  };

  const render = (result, requestedHash = "") => {
    const payload = result?._meta?.["bloom/view"];
    if (!payload?.html) return;
    const viewKey = result?.structuredContent?.view;
    if (viewKey) viewResultCache.set(viewKey, result);
    const page = new DOMParser().parseFromString(payload.html, "text/html");
    document.title = page.title || "Bloom dashboard";
    document.getElementById("bloom-styles").textContent = payload.css || "";
    document.getElementById("bloom-skin-styles").textContent = payload.skinCss || "";
    for (const image of page.querySelectorAll("img[src]")) {
      const replacement = payload.assets?.[image.getAttribute("src")];
      if (replacement) image.setAttribute("src", replacement);
    }
    const main = page.querySelector("main");
    if (!main) return;
    const title = main.querySelector(".intro h1")?.textContent?.trim() || page.title.split("·")[0].trim();
    const header = page.createElement("header");
    header.className = "widget-header";
    const brand = page.createElement("span");
    brand.className = "widget-brand";
    brand.setAttribute("aria-label", "Bloom");
    const brandMark = page.createElement("span");
    brandMark.className = "widget-brand-mark";
    brandMark.setAttribute("aria-hidden", "true");
    brandMark.textContent = "/";
    brand.append(brandMark, "bloom");
    const viewTitle = page.createElement("h1");
    viewTitle.className = "widget-view-title";
    viewTitle.textContent = title;
    header.append(brand, viewTitle);

    if (title === "Activity") prepareActivity(main);
    if (title === "Contacts") prepareContacts(main);
    if (title === "Receive") prepareReceive(page, main);
    prepareHoldingAccounts(page, main);
    prepareHistoricalAccounts(page, main);
    if (title === "Policy") preparePolicy(page, main);
    if (title === "Networks") prepareNetworks(page, main);
    if (title === "Markets") prepareMarkets(main);
    if (title === "Wallets") addCheckoutProbe(page, main);
    addViewAction(page, header, title);

    const walletDirectory = main.querySelector(".wallet-directory");
    if (walletDirectory?.querySelector(".directory-entry")) {
      const notices = [...main.querySelectorAll(
        ":scope > .coverage-notice, :scope > .callout, :scope > .directory-note"
      )];

      const count = main.querySelector(".inventory-summary > div:first-child strong");
      if (count) count.textContent = count.textContent.replace(/ loaded$/, "");
      const balanceLabel = main.querySelector(".inventory-value span");
      if (balanceLabel) balanceLabel.textContent = balanceLabel.textContent.replace(/\s*·\s*partial$/, "");

      addDataStatus(page, header, notices);
    }
    if (title === "Activity") {
      addDataStatus(page, header, [...main.querySelectorAll(":scope > .coverage-notice, :scope > p.coverage")]);
    } else if (title === "Contacts") {
      addDataStatus(page, header, [...main.querySelectorAll(":scope > .coverage-notice, :scope > details:not(.contacts-secondary), :scope > details.contacts-secondary:last-child")].filter((item) => item.textContent.includes("Excluded targets") || item.classList.contains("coverage-notice")));
    } else if (title === "Receive") {
      addDataStatus(page, header, [...main.querySelectorAll(":scope > .coverage-notice, :scope > .callout.warn")]);
    } else if (title === "Policy") {
      addDataStatus(page, header, [...main.querySelectorAll(":scope > .directory-note, :scope > .callout.warn")]);
    } else if (title === "Networks") {
      const notices = [...main.querySelectorAll(":scope > .coverage-notice, :scope > .callout, :scope > p.coverage")];
      const context = notices.find((item) => item.textContent.includes("Network-wide totals"));
      context?.remove();
      addDataStatus(page, header, notices.filter((item) => item !== context));
    } else if (title === "Markets") {
      addDataStatus(page, header, [...main.querySelectorAll(":scope > .chart-note")]);
    }
    main.prepend(header);
    for (const callout of main.querySelectorAll(".callout.warn")) {
      const details = page.createElement("details");
      details.className = "widget-callout";
      const summary = page.createElement("summary");
      summary.textContent = callout.querySelector("strong")?.textContent || "Important notice";
      details.append(summary);
      for (const child of [...callout.children]) {
        if (!child.matches("strong")) details.append(child);
      }
      callout.replaceWith(details);
    }
    for (const anchor of main.querySelectorAll("a[href]")) {
      const raw = anchor.getAttribute("href");
      if (!raw || raw.startsWith("#")) continue;
      let url;
      try { url = new URL(raw, "https://bloom.invalid/views/"); } catch { continue; }
      if (url.origin === "https://bloom.invalid") anchor.remove();
    }
    for (const emptyNav of main.querySelectorAll("nav:not(:has(a))")) emptyNav.remove();
    document.body.replaceChildren(document.importNode(main, true));
    enableNetworksSorting();
    enableCheckoutProbe();
    selectReceiveWallet(requestedHash);
    reportSize();
  };

  document.addEventListener("click", async (event) => {
    const viewButton = event.target.closest("button[data-view-tool]");
    if (viewButton) {
      if (!callableViewTools.has(viewButton.dataset.viewTool)) return;
      const viewKey = viewButton.dataset.viewTool.replace(/^show_bloom_/, "");
      const cached = viewResultCache.get(viewKey);
      if (cached) {
        render(cached);
        return;
      }
      viewButton.setAttribute("aria-busy", "true");
      try {
        const result = await send("tools/call", { name: viewButton.dataset.viewTool, arguments: {} });
        render(result);
      } catch (error) {
        viewButton.removeAttribute("aria-busy");
        console.error("Opening Bloom view failed", error);
      }
      return;
    }
    const receiveTab = event.target.closest("button[data-receive-target]");
    if (receiveTab) {
      const wallet = receiveTab.closest(".receiving-wallet");
      wallet.querySelectorAll(".receive-address-tab").forEach((button) => button.setAttribute("aria-selected", String(button === receiveTab)));
      wallet.querySelectorAll(".receiving-card").forEach((card) => { card.hidden = card.id !== receiveTab.dataset.receiveTarget; });
      reportSize();
      return;
    }
    const copyButton = event.target.closest("button[data-copy-address]");
    if (copyButton) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(copyButton.dataset.copyAddress);
        } else {
          const input = document.createElement("textarea");
          input.value = copyButton.dataset.copyAddress;
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.append(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        }
        copyButton.textContent = "Copied";
        setTimeout(() => { copyButton.textContent = "Copy"; }, 1400);
      } catch (error) {
        console.error("Copying address failed", error);
      }
      return;
    }
    const anchor = event.target.closest("a[href]");
    if (!anchor) return;
    const raw = anchor.getAttribute("href");
    if (!raw || raw.startsWith("#")) return;
    let url;
    try { url = new URL(raw, "https://bloom.invalid/views/"); } catch { return; }
    if (url.origin === "https://bloom.invalid") return;
    if (url.protocol === "https:" || url.protocol === "http:") {
      event.preventDefault();
      try { await send("ui/open-link", { url: url.href }); } catch (error) { console.error("Opening link failed", error); }
    }
  });

  addEventListener("message", (event) => {
    if (event.source !== parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (Object.prototype.hasOwnProperty.call(message, "id") && !message.method) {
      const waiter = pending.get(message.id);
      if (!waiter) return;
      pending.delete(message.id);
      if (message.error) waiter.reject(new Error(message.error.message));
      else waiter.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-result") render(message.params);
    else if (message.method === "ui/notifications/host-context-changed") setTheme(message.params);
    else if (message.method === "ping" && Object.prototype.hasOwnProperty.call(message, "id")) {
      answer(message.id, {});
    } else if (message.method === "ui/resource-teardown" && Object.prototype.hasOwnProperty.call(message, "id")) {
      answer(message.id, {});
    }
  });

  (async () => {
    try {
      const initialized = await send("ui/initialize", {
        appInfo: { name: "Bloom view", version: "1" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
        protocolVersion: "2026-01-26",
      });
      setTheme(initialized.hostContext);
      notify("ui/notifications/initialized");
      new ResizeObserver(reportSize).observe(document.documentElement);
    } catch (error) {
      document.body.innerHTML = `<p class="widget-status">Bloom widget could not connect to this host.</p>`;
      console.error(error);
    }
  })();
})();
</script>
</body>
</html>
