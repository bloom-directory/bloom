[package]
name = "bloom-petal-sdk-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros for Bloom local handler petal SDK entrypoints"

[lib]
name = "bloom_petal_sdk_macros"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
