[package]
name = "bloom-test-util"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared scaffolding for bloom-eth integration tests: validator/block/tx builders, multi-validator orchestration, RPC waiters, mock handlers"
publish = false

[dependencies]
bloom-chain-types     = { path = "../bloom-chain-types" }
bloom-chain-consensus = { path = "../bloom-chain-consensus" }
bloom-chain-state     = { path = "../bloom-chain-state" }
bloom-keystore        = { path = "../bloom-keystore" }
bloom-vfs             = { path = "../bloom-vfs" }
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "fs", "net"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
