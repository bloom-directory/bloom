[package]
name = "bloom-chain-node"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "bloom-chain v0 node: wires consensus + state + petal-execution + TCP transport + RPC"

[dependencies]
bloom-chain-types  = { path = "../bloom-chain-types" }
bloom-chain-state  = { path = "../bloom-chain-state" }
bloom-chain-consensus = { path = "../bloom-chain-consensus" }
bloom-petals       = { path = "../bloom-petals" }
bloom-script       = { path = "../bloom-script" }
bloom-objects      = { path = "../bloom-objects" }
bloom-value        = { path = "../bloom-value" }
bloom-petal-manifest = { path = "../bloom-petal-manifest" }
bloom-petal-fungible = { path = "../bloom-petal-fungible" }
bloom-keystore     = { path = "../bloom-keystore" }
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
toml    = "0.8"
tracing = "0.1"
anyhow  = "1"
base64.workspace = true
thiserror = "2"
blake3  = "1"
sled    = "0.34"
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"
clap    = { version = "4", features = ["derive", "env"] }
hex     = "0.4"
zbase32 = "0.1"
wasmparser.workspace = true

[dev-dependencies]
bloom-test-util = { path = "../bloom-test-util" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Used by adversarial test fixtures (e.g. `prevhash_threading.rs`).
wat = "1"
# Real-key signing helpers in `ptb_signature_rejection.rs`.
rand = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
