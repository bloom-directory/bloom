[package]
name = "bloom-resource-macros"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Proc-macros for the Bloom-native contracts framework: #[bloom::petal], #[object], #[capability], #[invariant]."

[lib]
name = "bloom_resource_macros"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
bloom-objects = { workspace = true }
bloom-petal-manifest = { workspace = true }

[dev-dependencies]
bloom-resource = { workspace = true }
bloom-objects = { workspace = true }

# The macro-emitted petal shim is gated on `feature = "no-entrypoint"`
# so downstream library consumers can suppress the wasm exports. The
# feature lives on the petal *crates* (e.g. `bloom-petal-cap`), not on
# this proc-macro crate. Tell `--check-cfg` about it so fixtures that
# expand the macro under this crate's own compilation context don't
# trip the `unexpected_cfgs` lint.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("no-entrypoint"))'] }
