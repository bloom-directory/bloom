[package]
name = "bloom-paid-x402"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "x402 adapter for Bloom paid HTTP requests"

[dependencies]
bloom-paid-http.workspace = true
base64.workspace = true
serde_json.workspace = true
alloy.workspace = true
async-trait.workspace = true
x402-chain-eip155 = { version = "2.0.0", features = ["client", "telemetry"] }
x402-types = "2.0.0"
tempfile.workspace = true
serde.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
bloom-solana.workspace = true
solana-message = { version = "4.5.0", features = ["wincode"] }
solana-pubkey = { version = "4.3.0", features = ["curve25519"] }
solana-instruction = "3.2.0"
wincode = "0.6"

[dev-dependencies]
reqwest.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
