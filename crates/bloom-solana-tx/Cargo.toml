[package]
name = "bloom-solana-tx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Solana transaction engine: durable outbox and reconciliation, mirroring bloom-tx's pattern for the new Signer+Broker custody triad"

[dependencies]
bloom-solana.workspace = true
bloom-broker-api.workspace = true
bloom-machine-client.workspace = true
base64.workspace = true
blake3.workspace = true
bs58.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
solana-message = { version = "4.5.0", features = ["wincode"] }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-transaction = { version = "4.2.0", features = ["verify", "wincode"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
wincode = "0.6"

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
