[package]
name = "bloom-checkout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bloom-checkout-api.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["query"] }
base64.workspace = true
clap.workspace = true
libc.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true
bloom-signer-api = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "fb31fef6a8ab44d9dc69d4b6a9b456dc0ed5726c" }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
