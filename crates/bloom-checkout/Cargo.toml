[package]
name = "bloom-checkout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
triad-dev-harness = []

[dependencies]
bloom-checkout-api.workspace = true
bloom-service-activation.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["query"] }
base64.workspace = true
clap.workspace = true
libc.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true
bloom-signer-api = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "3484e82523b1c37f9850ad6c660ffa2cd787f304" }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
rusqlite.workspace = true

[dev-dependencies]
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile.workspace = true
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
rcgen = "0.14"
