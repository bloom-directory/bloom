[package]
name = "bloom-petal-sdk"
version = "0.1.0"
edition = "2024"
description = "Guest SDK for wasm32 petals on bloom-chain"
license = "MIT"

[lib]
name = "bloom_petal_sdk"
crate-type = ["rlib"]

[dependencies]
bloom-chain-abi = { workspace = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }
