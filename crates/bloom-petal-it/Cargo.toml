[package]
name = "bloom-petal-it"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Integration tests for the bloom-native contracts framework (PTB fungible flow + linearity/cap reverts)"

[lib]
doctest = false

[dependencies]
bloom-chain-node     = { path = "../bloom-chain-node" }
bloom-chain-state    = { path = "../bloom-chain-state" }
bloom-chain-types    = { path = "../bloom-chain-types" }
bloom-petal-fungible = { path = "../bloom-petal-fungible" }
bloom-petal-manifest = { path = "../bloom-petal-manifest" }
bloom-petals         = { path = "../bloom-petals" }
bloom-objects        = { path = "../bloom-objects" }
bloom-script         = { path = "../bloom-script" }
bloom-resource       = { path = "../bloom-resource" }
blake3               = "1"
anyhow               = "1"
wat                  = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
