[package]
name = "bloom-petal-fungible"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "/bloom/petals/core/fungible petal: Coin<T>, MintCap<T>, BurnCap<T>, Supply<T>, LOOM marker, EpochZero (spec §9, §14.1)."

[lib]
name = "bloom_petal_fungible"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects = { workspace = true }

[features]
default = []
# Solana/Anchor-style flag: when consumers depend on this petal as a
# library (e.g. another petal's tests) they set
# `features = ["no-entrypoint"]` to suppress the wasm export symbols and
# avoid duplicate `__petal_<fn>` exports at link time.
no-entrypoint = []
