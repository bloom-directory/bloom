[package]
name = "bloom-contract-macros"
version = "0.1.0"
edition = "2024"
description = "Proc-macros for bloom-contract: #[bloom::contract], #[storage], #[event], #[error], #[init], #[interface]."
license = "MIT"

[lib]
name = "bloom_contract_macros"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
blake3 = { version = "1" }
serde_json = { workspace = true }
