[package]
name = "bloom-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only Solana chain client: layered JSON-RPC transport, account/balance/status lookups, transaction simulation"

[features]
# The isolated Solana mainnet-beta canary. Never enabled by packaged builds;
# release packaging rejects an artifact built with it.
mainnet-canary = ["bloom-proto/mainnet-canary"]

[dependencies]
bloom-rpc-common.workspace = true
bloom-proto.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
