# 4-validator bloom-chain test network.
#
# Image is built locally as `bloom-eth:test` (see ./Dockerfile, owned by the
# protocol agent). Each validator binds a host-side home directory generated
# by `bloom chain testnet` into `/home/bloom`, so the per-node `chain/` tree
# (genesis.toml, config.toml, keystore, blocks, state_blobs) is provisioned
# before compose starts.
#
# Networking:
#   - Internal: validators reach each other on `val0`..`val3` via docker DNS;
#     peer TCP on 26656, RPC TCP on 8545 (both bound to 0.0.0.0 inside the
#     container so the listener accepts cross-host connections).
#   - External: each validator's RPC is published to the loopback host on
#     18545..18548 so tests/cargo can drive them from the host network.
#
# Readiness: each service has a healthcheck that probes 127.0.0.1:8545 inside
# the container; `docker compose up --wait` returns only when all four are
# healthy.
#
# Required env (set by scripts/test-docker-dex.sh):
#   BLOOM_DOCKER_TMPDIR — absolute host path containing home0..home3.

services:
  val0:
    image: bloom-eth:test
    build:
      context: .
      dockerfile: Dockerfile
      # Host networking for the BuildKit step: the default BuildKit network
      # has intermittent DNS resolution failures when rustup tries to fetch
      # https://static.rust-lang.org/dist/channel-rust-stable.toml.sha256
      # during `cargo chef prepare`. The host's DNS is verified working, so
      # we punch through. This only affects build time, not container runtime.
      network: host
    container_name: bloom-val0
    hostname: val0
    command: ["--home", "/home/bloom", "chain", "run-validator"]
    environment:
      RUST_LOG: ${RUST_LOG:-warn}
      RUST_BACKTRACE: "1"
      BLOOM_BLOCK_PRUNE_WINDOW: ${BLOOM_BLOCK_PRUNE_WINDOW:-8}
      BLOOM_STATE_BLOB_RETENTION: ${BLOOM_STATE_BLOB_RETENTION:-4}
      BLOOM_RPC_UDS: "0"
    volumes:
      - ${BLOOM_DOCKER_TMPDIR}/home0:/home/bloom
    ports:
      - "127.0.0.1:18656:26656"
      - "127.0.0.1:18545:8545"
    expose:
      - "26656"
      - "8545"
    healthcheck:
      test: ["CMD-SHELL", "BLOOM_RPC_TCP=127.0.0.1:8545 /usr/local/bin/bloom --home /home/bloom chain health >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  val1:
    image: bloom-eth:test
    build:
      context: .
      dockerfile: Dockerfile
      # Host networking for the BuildKit step: the default BuildKit network
      # has intermittent DNS resolution failures when rustup tries to fetch
      # https://static.rust-lang.org/dist/channel-rust-stable.toml.sha256
      # during `cargo chef prepare`. The host's DNS is verified working, so
      # we punch through. This only affects build time, not container runtime.
      network: host
    container_name: bloom-val1
    hostname: val1
    command: ["--home", "/home/bloom", "chain", "run-validator"]
    environment:
      RUST_LOG: ${RUST_LOG:-warn}
      RUST_BACKTRACE: "1"
      BLOOM_BLOCK_PRUNE_WINDOW: ${BLOOM_BLOCK_PRUNE_WINDOW:-8}
      BLOOM_STATE_BLOB_RETENTION: ${BLOOM_STATE_BLOB_RETENTION:-4}
      BLOOM_RPC_UDS: "0"
    volumes:
      - ${BLOOM_DOCKER_TMPDIR}/home1:/home/bloom
    ports:
      - "127.0.0.1:18657:26656"
      - "127.0.0.1:18546:8545"
    expose:
      - "26656"
      - "8545"
    healthcheck:
      test: ["CMD-SHELL", "BLOOM_RPC_TCP=127.0.0.1:8545 /usr/local/bin/bloom --home /home/bloom chain health >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  val2:
    image: bloom-eth:test
    build:
      context: .
      dockerfile: Dockerfile
      # Host networking for the BuildKit step: the default BuildKit network
      # has intermittent DNS resolution failures when rustup tries to fetch
      # https://static.rust-lang.org/dist/channel-rust-stable.toml.sha256
      # during `cargo chef prepare`. The host's DNS is verified working, so
      # we punch through. This only affects build time, not container runtime.
      network: host
    container_name: bloom-val2
    hostname: val2
    command: ["--home", "/home/bloom", "chain", "run-validator"]
    environment:
      # Debug-level logging on val2 only so we can capture what it was doing
      # when it stopped logging at height 19 in the prior run. The other
      # validators stay at the default level to keep noise down.
      RUST_LOG: "info,bloom_chain_node=debug,bloom_chain_consensus=debug,bloom_petals=debug"
      RUST_BACKTRACE: "1"
      BLOOM_BLOCK_PRUNE_WINDOW: ${BLOOM_BLOCK_PRUNE_WINDOW:-8}
      BLOOM_STATE_BLOB_RETENTION: ${BLOOM_STATE_BLOB_RETENTION:-4}
      BLOOM_RPC_UDS: "0"
    volumes:
      - ${BLOOM_DOCKER_TMPDIR}/home2:/home/bloom
    ports:
      - "127.0.0.1:18658:26656"
      - "127.0.0.1:18547:8545"
    expose:
      - "26656"
      - "8545"
    healthcheck:
      test: ["CMD-SHELL", "BLOOM_RPC_TCP=127.0.0.1:8545 /usr/local/bin/bloom --home /home/bloom chain health >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  val3:
