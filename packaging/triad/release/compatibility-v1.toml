schema = "bloom.triad-compatibility/1"

[revisions]
broker_commit = "8ee8842bc218bf4051455136ce43e3c862f25e0c"
signer_commit = "97f2c8e852ed3330e680fef3f11643e6e0e63e6d"
service_runtime_commit = "48b83c54c1787b4aff2456bd3adbe18856902e45"
petal_contract_commit = "7dd2722db5de305dd63ca4ed03591f3ab82fa40b"

# Persisted credential surfaces and registration selections are unreadable by
# the released Machine reader; see docs/reviews/2026-09-23-schema-migration.md.
# Machine state 3 adds `review_payload_digest` to pending exact-signing state,
# which Machine 0.4.x rejects as an unknown field.
[state.machine]
current = 3
downgrade_floor = 3
migration_floor = 1

[state.broker]
current = 3
downgrade_floor = 3
migration_floor = 1

[state.signer]
current = 2
downgrade_floor = 2
migration_floor = 1

[protocols.machine_broker]
major = 1
minor_min = 8
minor_max = 8

[protocols.broker_signer]
major = 1
minor_min = 6
minor_max = 6

[protocols.signer_control]
major = 1
minor_min = 0
minor_max = 1

[protocols.session]
major = 1
minor_min = 0
minor_max = 1

[[bundles]]
machine = "0.4.2"
broker = "0.1.0"
signer = "0.1.0"
backends = ["local"]
algorithms = ["ed25519", "secp256k1", "p256"]

[unsupported]
behavior = "fail_closed"
reason = "a service package is unsupported only when one of its independently owned edge ranges does not overlap the peer's selected wire version"
