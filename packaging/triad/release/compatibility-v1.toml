schema = "bloom.triad-compatibility/1"

[revisions]
broker_commit = "5095af43ad22994cb0a0bdad07a1d7adcf2410eb"
signer_commit = "bc88ad690757165ebf1978410ea5c7ec652215d3"
service_runtime_commit = "ad0072512bb97fb4eb68d249ce785ea3ea4a49ab"
petal_contract_commit = "73c5b06a77599368fbc79fb7947a629b5b4c630e"

# Persisted credential surfaces and registration selections are unreadable by
# the released Machine reader; see docs/reviews/2026-09-23-schema-migration.md.
[state.machine]
current = 2
downgrade_floor = 2
migration_floor = 1

[state.broker]
current = 2
downgrade_floor = 2
migration_floor = 1

[state.signer]
current = 2
downgrade_floor = 2
migration_floor = 1

[protocols.machine_broker]
major = 1
minor_min = 7
minor_max = 7

[protocols.broker_signer]
major = 1
minor_min = 6
minor_max = 6

[protocols.signer_control]
major = 1
minor_min = 0
minor_max = 1

[protocols.session]
major = 1
minor_min = 0
minor_max = 1

[[bundles]]
machine = "0.4.0"
broker = "0.1.0"
signer = "0.1.0"
backends = ["local"]
algorithms = ["ed25519", "secp256k1", "p256"]

[unsupported]
behavior = "fail_closed"
reason = "a service package is unsupported only when one of its independently owned edge ranges does not overlap the peer's selected wire version"
