schema = "bloom.triad-compatibility/1"

[revisions]
broker_commit = "937729b41c50daf6b8b8cf30b2b7fa1641b1048a"
signer_commit = "34248a3711d8c1c7ddb99d76b3ff5b976e536485"
service_runtime_commit = "a046fd6075853e8591f295983b572c6e1d65d12d"
petal_contract_commit = "73c5b06a77599368fbc79fb7947a629b5b4c630e"

# Persisted credential surfaces and registration selections are unreadable by
# the released Machine reader; see docs/reviews/2026-09-23-schema-migration.md.
[state.machine]
current = 2
downgrade_floor = 2
migration_floor = 1

[state.broker]
current = 2
downgrade_floor = 2
migration_floor = 1

[state.signer]
current = 2
downgrade_floor = 2
migration_floor = 1

[protocols.machine_broker]
major = 1
minor_min = 7
minor_max = 7

[protocols.broker_signer]
major = 1
minor_min = 6
minor_max = 6

[protocols.signer_control]
major = 1
minor_min = 0
minor_max = 1

[protocols.session]
major = 1
minor_min = 0
minor_max = 1

[[bundles]]
machine = "0.4.0"
broker = "0.1.0"
signer = "0.1.0"
backends = ["local"]
algorithms = ["ed25519", "secp256k1", "p256"]

[unsupported]
behavior = "fail_closed"
reason = "a service package is unsupported only when one of its independently owned edge ranges does not overlap the peer's selected wire version"
