# Playground stack for bloom.
#
# Brings up an anvil node so the user can broadcast real transactions
# locally without ever touching mainnet. The host-side bloom binary
# (started by scripts/play.sh) talks to this node over the published
# 8545 port. Base mainnet is configured separately in the play home as
# read-only.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: bloom-play-anvil
    # Foundry's image entrypoint defers to `anvil` via the `cast`/`anvil`
    # multitool. Overriding entrypoint+command keeps the invocation
    # explicit.
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --block-time
      - "1"
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cast chain-id --rpc-url http://localhost:8545 >/dev/null 2>&1 ||
          exit 1
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
