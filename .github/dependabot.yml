version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Minor and patch bumps (including security fixes) ride together;
    # semver-major bumps open their own PRs so they never block the group.
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
