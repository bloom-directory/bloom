name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run tests
        run: cargo test --workspace
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  locked-build:
    name: locked release build
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Build full-feature binary with locked dependencies
        run: cargo build --release -p bloom --all-features --locked
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  docker-petal-vfs:
    name: docker petal VFS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install NFS client
        run: sudo apt-get update && sudo apt-get install -y nfs-common
      - name: Run docker petal VFS acceptance
        run: scripts/test-docker-petal-vfs.sh
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
