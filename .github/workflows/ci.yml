name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run tests
        run: cargo test --workspace
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  locked-build:
    name: locked release build
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Build full-feature binary with locked dependencies
        run: cargo build --release -p bloom --all-features --locked
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  docker-petal-vfs:
    name: docker petal VFS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install NFS client
        run: sudo apt-get update && sudo apt-get install -y nfs-common
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: bloom-eth:test
          network: host
          cache-from: type=gha,scope=bloom-eth
          cache-to: type=gha,scope=bloom-eth,mode=max
      - name: Run docker petal VFS acceptance
        env:
          BLOOM_DOCKER_IMAGE_PREBUILT: "1"
          BLOOM_DOCKER_LOG_DIR: ${{ runner.temp }}/bloom-docker-petal-vfs-logs
        run: scripts/test-docker-petal-vfs.sh
      - name: Upload docker petal VFS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-petal-vfs-diagnostics
          path: ${{ runner.temp }}/bloom-docker-petal-vfs-logs
          if-no-files-found: warn
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # Hermetic real-wasm invariant ABI gate: compiles the example petal to
  # wasm32 and exercises the `__inv_<idx>` chain-VM host/guest ABI seam
  # in-process (no anvil/network/docker). `#[ignore]`d (heavy) so it doesn't
  # run in the host `test` job; gated on PRs here — this is the regression
  # gate for the latent calldata/`petal.return` ABI class of bug.
  #
  # Scoped to `real_inv_wasm` only. The `real_wasm_pool` end-to-end gate is
  # intentionally NOT run here: it depends on the DEX pool minting coins,
  # which #26 disallowed (`COIN_MINTER_PATHS` = core fungible only, with a
  # unit test), while leaving the DEX example still minting — so it fails on
  # `origin/master` too. That's a pre-existing DEX bug for the maintainer,
  # unrelated to the invariant subsystem. The full `--ignored` acceptance
  # suite stays master-push/manual only.
  real-wasm-gates:
    name: real-wasm invariant gate
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain and WASM target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run hermetic real-wasm invariant ABI gate
        run: cargo test -p bloom-petal-dex-it --test real_inv_wasm -- --ignored
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
