name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          df -h
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast -E 'not (binary(chain_testnet_provision) | binary(chain_smoke))'
      - name: Run doctests
        run: cargo test --workspace --doc
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  chain-subprocess-test:
    name: chain subprocess test
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          df -h
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Build bloom CLI for subprocess tests
        run: cargo build -p bloom --bin bloom
      - name: Run chain subprocess tests
        run: cargo test -p bloom-it --test chain_testnet_provision
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  locked-build:
    name: locked release build
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Build full-feature binary with locked dependencies
        run: cargo build --release -p bloom --all-features --locked
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  docker-petal-vfs:
    name: docker petal VFS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install NFS client
        run: sudo apt-get update && sudo apt-get install -y nfs-common
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: bloom-eth:test
          network: host
          cache-from: type=gha,scope=bloom-eth
          cache-to: type=gha,scope=bloom-eth,mode=max
      - name: Run docker petal VFS acceptance
        env:
          BLOOM_DOCKER_IMAGE_PREBUILT: "1"
          BLOOM_DOCKER_LOG_DIR: ${{ runner.temp }}/bloom-docker-petal-vfs-logs
        run: scripts/test-docker-petal-vfs.sh
      - name: Upload docker petal VFS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-petal-vfs-diagnostics
          path: ${{ runner.temp }}/bloom-docker-petal-vfs-logs
          if-no-files-found: warn
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # Hermetic real-wasm invariant gates: compile the example petals to
  # wasm32 and exercise invariant ABI + full PTB object-invariant receipt
  # propagation in-process (no anvil/network/docker). `#[ignore]`d (heavy)
  # so these don't run in the host `test` job; gated on PRs here.
  real-wasm-gates:
    name: real-wasm invariant gates
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain and WASM target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run hermetic real-wasm invariant ABI gate
        run: cargo test -p bloom-petal-dex-it --test real_inv_wasm -- --ignored
      - name: Run real-wasm PTB object-invariant gate
        run: cargo test -p bloom-petal-dex-it --test real_wasm_pool real_pool_swap_exact_in_executes -- --ignored
      - name: Run chain-authoritative capability gate
        run: cargo test -p bloom-petal-it --test real_mintcap_revert
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
