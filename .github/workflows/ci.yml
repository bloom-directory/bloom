name: CI

on:
  pull_request:
    paths: &code_paths
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "examples/**"
      - "evals/harbor/**"
      - "packaging/**"
      - "scripts/**"
      - "tests/**"
      - "Dockerfile"
      - "DEVELOPMENT.md"
  push:
    branches:
      - master
    paths: *code_paths
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  harbor_eval_static:
    name: Harbor eval static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Validate bounded Harbor harness
        run: scripts/test-harbor-evals.sh
      - name: Validate hosted relay launcher readiness
        run: scripts/test-triad-dev-hosted-relay.sh
      # Failure-mode cases for the ceremony-port A/B concurrency script
      # (stub launchers; binds no ports and needs no Triad).
      - name: Run concurrency script failure-mode cases
        run: scripts/test-ceremony-port-concurrency-cases.sh
      - name: Run release-notes generator cases
        run: scripts/test-release-notes.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # Doctests can't be captured in a nextest archive, so they compile separately.
  # An independent job (no `needs`) keeps that compile off the test critical path.
  doctests:
    name: doctests
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run doctests
        run: cargo test --workspace --doc --no-fail-fast
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  build_test_archive:
    name: build test archive
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Build nextest archive
        run: cargo nextest archive --workspace --all-targets --archive-file target/nextest-archive.tar.zst
      # deployment_rpc tests drive the real `bloom deploy … rpc`
      # bridge as a subprocess, so it needs the CLI itself and not a test
      # binary. A nextest archive carries test binaries only, so the lanes
      # that run it would find nothing at target/debug/bloom. Build it in the
      # one job that compiles and ship it beside the archive: the execution
      # lanes stay compile-free.
      - name: Build the bloom CLI for the deployment bridge
        run: cargo build --bin bloom --locked
      - name: Upload nextest archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 3
      - name: Upload the bloom CLI
        uses: actions/upload-artifact@v4
        with:
          name: bloom-cli
          path: target/debug/bloom
          if-no-files-found: error
          retention-days: 3
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # Pure test-execution lanes below: they only run prebuilt binaries from the
  # archive, so they carry no sccache/target cache and do no compilation.
  unit_test:
    name: unit tests
    runs-on: ubuntu-latest
    needs: build_test_archive
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: target
      - name: Run library unit tests from archive
        run: cargo nextest run --archive-file target/nextest-archive.tar.zst -E 'kind(lib) or (package(bloom) and kind(bin))' --no-fail-fast

  integration_test:
    name: local integration tests
    runs-on: ubuntu-latest
    needs: build_test_archive
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # The Hardhat half of the deployment compatibility test installs and
      # runs a project with npm, so the Node version is pinned rather than
      # inherited from whatever the runner image ships this month. Hardhat
      # refuses to start below 22.13, so this floor is the tool's, not a
      # preference.
      - name: Install Node.js for the Hardhat compatibility project
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: target
      - name: Download the bloom CLI
        uses: actions/download-artifact@v4
        with:
          name: bloom-cli
          path: target/debug
      - name: Make the bloom CLI executable
        run: chmod +x target/debug/bloom
      - name: Run CLI and default local integration tests from archive
        run: |
          cargo nextest run --archive-file target/nextest-archive.tar.zst \
            -E 'package(bloom) and binary(cli)' \
            --no-fail-fast
          cargo nextest run --archive-file target/nextest-archive.tar.zst \
            -E 'package(bloom-it) and (binary(anvil_e2e) or binary(erc20_e2e))' \
            --no-fail-fast
      # The triad release binary asserts the content of the packaged
      # installers, launcher, and release gates. It was previously not run at
      # all, so a launcher change could silently invalidate its assertions.
      #
      # The macOS installer tests are excluded because that installer uses BSD
      # `mv -fh`, which GNU coreutils has no equivalent for; they belong to the
      # macOS job, not this Linux runner. Nothing else is excluded: the
      # launcher no longer needs a sibling-repo layout to reject a bad
      # argument, so the whole Linux-capable set runs here.
      - name: Install bsdtar for reproducible bundle packaging
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Check native macOS mount preflight
        run: bash tests/packaging/macos-native-mount-preflight.sh
      - name: Run triad release packaging tests from archive
        # build-bundle.sh pins ownership with `--uid`/`--gid`, which is bsdtar
        # syntax; GNU tar rejects it. TAR must therefore be explicit rather
        # than inherited from whatever `tar` the runner happens to provide.
        env:
          TAR: bsdtar
        run: >
          cargo nextest run --archive-file target/nextest-archive.tar.zst
          -E 'package(bloom-it) and binary(triad_release) and not test(/^macos_/)'
          --no-fail-fast
      # Every `solana_*` binary drives a local Agave validator, which this job
      # does not start; they run in the dedicated solana-validator workflow.
      # Matching the prefix rather than one binary name keeps a new Solana
      # suite from silently landing in this anvil-only step.
      # The filter stays on one line. In a YAML folded scalar a line indented
      # deeper than the block keeps its newline, which silently pushed the
      # trailing flags onto their own shell line: the run then executed
      # without --run-ignored and swept up every non-ignored test, including
      # the macOS installer tests the packaging step excludes on purpose.
      - name: Run ignored local anvil integration tests from archive
        run: >
          cargo nextest run --archive-file target/nextest-archive.tar.zst
          -E '(package(bloom-it) and not binary(/^solana_/) and not binary(deployment_rpc)) or package(bloom-watch)'
          --run-ignored ignored-only
          --no-tests=pass
          --no-fail-fast
      # Split out so its prerequisites are visible and a failure is
      # attributable. Inside the blanket step above this test had no CLI to
      # run and its outcome was not separable from a dozen others.
      # --no-tests=fail is deliberate: the point of this step is that the
      # deployment compatibility test actually executes, so a filter that
      # stops matching it must fail the job rather than pass silently.
      - name: Run deployment compatibility tests from archive
        env:
          BLOOM_TEST_BINARY: ${{ github.workspace }}/target/debug/bloom
        run: >
          cargo nextest run --archive-file target/nextest-archive.tar.zst
          -E 'package(bloom-it) and binary(deployment_rpc)'
          --run-ignored all
          --no-tests=fail
          --no-fail-fast
      - name: Run engine contract-creation integration test
        run: |
          anvil --port 18545 > /tmp/bloom-creation-anvil.log 2>&1 &
          creation_anvil_pid=$!
          trap 'kill "$creation_anvil_pid"' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:18545 > /dev/null; then break; fi
            sleep 0.1
          done
          BLOOM_TEST_ANVIL_URL=http://127.0.0.1:18545 cargo nextest run --archive-file target/nextest-archive.tar.zst -E 'package(bloom-tx) and test(anvil_creation_approval_broadcast_receipt_and_dependent_call)' --run-ignored ignored-only --no-tests=fail

  macos_unix_principal_disposable_w0:
    name: macOS Unix-principal disposable W0
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'triad-architecture'
    uses: ./.github/workflows/macos-unix-conformance.yml
    with:
      broker_ref: 9f394aebbc9c04a6031de31a12385e5485f8ca9b
      signer_ref: bc88ad690757165ebf1978410ea5c7ec652215d3

  linux_w0_isolation:
    name: Linux W0 principal and socket isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Verify rendered systemd units
        run: |
          unit_dir="$(mktemp -d)"
          cp packaging/triad/linux/systemd/*.socket "$unit_dir/"
          for source in packaging/triad/linux/systemd/*.service.in; do
            destination="$unit_dir/$(basename "${source%.in}")"
            sed 's|@BLOOM_BROKER_BINARY@|/usr/bin/true|; s|@BLOOM_SIGNER_BINARY@|/usr/bin/true|' \
              "$source" > "$destination"
          done
          cp "$unit_dir/bloom-signer@.service" "$unit_dir/bloom-signer@1000.service"
          systemd-analyze verify \
            "$unit_dir"/*.socket \
            "$unit_dir"/*.service \
            "$unit_dir/bloom-signer@1000.service"
      - name: Run Linux packaging assertions
        run: cargo test -p bloom-it --test linux_packaging --locked
  e2e_tests:
    name: external e2e tests
    runs-on: ubuntu-latest
    needs: build_test_archive
    timeout-minutes: 60
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      BLOOM_MAINNET_RPC: ${{ secrets.BLOOM_MAINNET_RPC }}
      BLOOM_ETHERSCAN_KEY: ${{ secrets.BLOOM_ETHERSCAN_KEY }}
      BLOOM_RUN_LIVE_TESTS: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: target
      - name: Report external secret availability
        run: |
          for name in BLOOM_MAINNET_RPC BLOOM_ETHERSCAN_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "$name=available"
            else
              echo "$name=missing (matching tests should self-skip)"
            fi
          done
      - name: Run live-network Rust e2e tests from archive
        run: |
          cargo nextest run --archive-file target/nextest-archive.tar.zst \
            -E 'package(bloom-ens) and binary(live_mainnet)' \
            --no-tests=pass \
            --no-fail-fast
          cargo nextest run --archive-file target/nextest-archive.tar.zst \
            -E 'kind(lib) and (package(bloom-etherscan) or package(bloom-prices))' \
            --no-tests=pass \
            --no-fail-fast
          BLOOM_RUN_NETWORK_TESTS=1 cargo nextest run \
            --archive-file target/nextest-archive.tar.zst \
            -E 'package(bloom) and test(github_source_install_polymarket_dispatches_route_contract)' \
            --no-fail-fast

  # The heavy docker mount suite is opt-in via workflow_dispatch only.
  docker:
    name: docker (${{ matrix.mode }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        mode: [mount]
    steps:
      - uses: actions/checkout@v6
      - name: Run docker ${{ matrix.mode }} suite
        run: |
          case "${{ matrix.mode }}" in
            mount)
              bash tests/docker/run.sh --mount
              ;;
          esac

  locked-build:
    name: locked release build
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Build full-feature binary with locked dependencies
        run: cargo build --release -p bloom --all-features --locked
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # The one real-service gate: the Machine from this checkout, with the Broker
  # and Signer the release matrix pins, enrolls a wallet, stages a Solana
  # transfer, holds it for approval and settles it on a local validator. The
  # Harbor smoke drives it with no model, no Docker and no venue.
  real_triad_smoke:
    name: real-triad Solana smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          path: bloom
      - name: Read the release matrix pins
        id: pins
        working-directory: bloom
        run: |
          matrix=packaging/triad/release/compatibility-v1.toml
          broker="$(sed -n -E 's/^broker_commit = "([0-9a-f]{40})"$/\1/p' "$matrix")"
          signer="$(sed -n -E 's/^signer_commit = "([0-9a-f]{40})"$/\1/p' "$matrix")"
          [[ -n "$broker" && -n "$signer" ]] || { echo "::error::$matrix must pin full Broker and Signer commits"; exit 1; }
          echo "broker=$broker" >> "$GITHUB_OUTPUT"
          echo "signer=$signer" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned Broker
        uses: actions/checkout@v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ steps.pins.outputs.broker }}
          path: bloom-broker
      - name: Check out the pinned Signer
        uses: actions/checkout@v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ steps.pins.outputs.signer }}
          path: bloom-signer
      - name: Install Rust toolchain
        working-directory: bloom
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bloom
            bloom-broker
            bloom-signer
          cache-targets: false
      - uses: astral-sh/setup-uv@v7
      - name: Install pinned agave v3.0.0 validator
        run: |
          curl -sSL -o /tmp/agave-install.sh https://release.anza.xyz/v3.0.0/install
          echo "7d588d188cb9ea550434cabc62a9927cf75de22e1aeb2a87f2352071812944fb  /tmp/agave-install.sh" | sha256sum -c -
          sh /tmp/agave-install.sh v3.0.0
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # The developer launcher runs the services as systemd user units and
      # mounts the Machine over loopback NFS with a noninteractive sudo rule;
      # the runner's unrestricted sudo satisfies that rule.
      - name: Install the launcher's Linux prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y nfs-common
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null
      - name: Build the three services with the developer harness
        run: |
          (cd bloom && cargo build --release --locked -p bloom --features triad-dev-harness)
          (cd bloom-broker && cargo build --release --locked -p bloom-broker -p bloom-broker-debug-driver --features bloom-broker/triad-dev-harness)
          (cd bloom-signer && cargo build --release --locked -p bloom-signer --features triad-dev-harness)
      - name: Run the Solana transfer smoke against the real Triad
        working-directory: bloom
        env:
          BLOOM_INTEGRATION_MACHINE_BIN: ${{ github.workspace }}/bloom/target/release/bloom
          BLOOM_INTEGRATION_BROKER_BIN: ${{ github.workspace }}/bloom-broker/target/release/bloom-broker
          BLOOM_INTEGRATION_SIGNER_BIN: ${{ github.workspace }}/bloom-signer/target/release/bloom-signer
          BLOOM_INTEGRATION_DEBUG_DRIVER_BIN: ${{ github.workspace }}/bloom-broker/target/release/bloom-broker-debug-driver
          BLOOM_EVAL_JOBS_DIR: ${{ runner.temp }}/harbor-jobs
        run: scripts/evals/run-harbor.sh solana-transfer codex --smoke
      - name: Upload the smoke summary and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-triad-smoke
          path: |
            ${{ runner.temp }}/harbor-jobs/summaries
            ~/.cache/bloom-harbor/**/*.log
          if-no-files-found: ignore
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
