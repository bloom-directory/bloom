name: acceptance

on:
  pull_request:
    paths:
      - .github/workflows/acceptance.yml
      - scripts/lib.sh
      - docker-compose.yml
      - Dockerfile
      - crates/bloom*/**
      - crates/bloom-mount/**
      - crates/bloom-evm*/**
      - crates/bloom-petal*/**

  push:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  ignored-tests:
    name: cargo test -- --ignored
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Rust toolchain and WASM target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build bloom CLI for subprocess tests
        run: cargo build -p bloom --bin bloom
      - name: Build workspace (release-ish; debug is fine for acceptance)
        run: cargo build --workspace --tests
      - name: Run --ignored acceptance tests
        run: cargo nextest run --workspace --run-ignored ignored-only --no-fail-fast
