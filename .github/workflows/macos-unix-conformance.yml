name: macOS Unix-principal conformance

on:
  workflow_call:
    inputs:
      broker_ref:
        description: Public bloom-broker ref
        required: false
        type: string
        default: 81b30c0725200c97db0d3ab67299c617f31f30ad
      signer_ref:
        description: Public bloom-signer ref
        required: false
        type: string
        default: 104cf2183b3b33224ef79caab091bcc80875dd9d
  workflow_dispatch:
    inputs:
      broker_ref:
        description: Public bloom-broker ref
        required: true
        default: 81b30c0725200c97db0d3ab67299c617f31f30ad
      signer_ref:
        description: Public bloom-signer ref
        required: true
        default: 104cf2183b3b33224ef79caab091bcc80875dd9d

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  build-candidate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: bloom
      - name: Reject mutable sibling refs
        shell: bash
        env:
          BROKER_REF: ${{ inputs.broker_ref || '81b30c0725200c97db0d3ab67299c617f31f30ad' }}
          SIGNER_REF: ${{ inputs.signer_ref || '104cf2183b3b33224ef79caab091bcc80875dd9d' }}
        run: |
          [[ "$BROKER_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SIGNER_REF" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ inputs.broker_ref || '81b30c0725200c97db0d3ab67299c617f31f30ad' }}
          path: bloom-broker
      - name: Check out Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ inputs.signer_ref || '104cf2183b3b33224ef79caab091bcc80875dd9d' }}
          path: bloom-signer
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Configure shared release build directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bloom-release-target" >> "$GITHUB_ENV"
      - name: Restore release build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bloom-release-target
          key: >-
            macos-release-target-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('bloom/Cargo.lock', 'bloom-broker/Cargo.lock',
            'bloom-signer/Cargo.lock') }}

      - name: Build signed macOS candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          bloom/packaging/triad/release.sh build macos \
            --broker-root "$GITHUB_WORKSPACE/bloom-broker" \
            --signer-root "$GITHUB_WORKSPACE/bloom-signer" \
            --output-dir "$RUNNER_TEMP/triad-dist"
          mkdir "$RUNNER_TEMP/verified"
          tar -xzf \
            "$RUNNER_TEMP/triad-dist/bloom-triad-test-unclaimed.tar.gz" \
            -C "$RUNNER_TEMP/verified"

          # The W0 checks refuse the smoke-test candidate's test-unclaimed
          # platform claim. Re-bundle the verified candidate's binaries under
          # the W0 claim with its own release key, staging them fresh exactly
          # as the two-login conformance workflow builds its fixtures;
          # build-bundle.sh nests the Linux installer copy when staging
          # already carries an installer/ tree.
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/w0-release-key"
          mkdir -p "$RUNNER_TEMP/w0-staging/bin"
          cp -p \
            "$RUNNER_TEMP/verified/bloom-triad/bin/bloom" \
            "$RUNNER_TEMP/verified/bloom-triad/bin/bloom-broker" \
            "$RUNNER_TEMP/verified/bloom-triad/bin/bloom-signer" \
            "$RUNNER_TEMP/verified/bloom-triad/bin/bloom-signer-migrate" \
            "$RUNNER_TEMP/w0-staging/bin/"
          cp -p \
            "$RUNNER_TEMP/verified/bloom-triad/compatibility-v1.toml" \
            "$RUNNER_TEMP/w0-staging/compatibility-v1.toml"
          mkdir "$RUNNER_TEMP/verified-w0"
          BLOOM_PLATFORM_CLAIM=macos-unix-principals-w0 \
            BLOOM_ALLOW_MACOS_UNIX_W0=true \
            BLOOM_MACHINE_SHA="$(git -C bloom rev-parse HEAD)" \
            BLOOM_BROKER_SHA="$(git -C bloom-broker rev-parse HEAD)" \
            BLOOM_SIGNER_SHA="$(git -C bloom-signer rev-parse HEAD)" \
            BLOOM_COMPATIBILITY_FILE="$RUNNER_TEMP/w0-staging/compatibility-v1.toml" \
            bloom/packaging/triad/release/build-bundle.sh \
            "$RUNNER_TEMP/w0-staging" \
            "$RUNNER_TEMP/triad-dist/bloom-triad-macos-unix-principals-w0.tar.gz" \
            "$RUNNER_TEMP/w0-release-key" \
            1700000000
          tar -xzf \
            "$RUNNER_TEMP/triad-dist/bloom-triad-macos-unix-principals-w0.tar.gz" \
            -C "$RUNNER_TEMP/verified-w0"

      - name: Upload verified macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-conformance-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/triad-dist
            ${{ runner.temp }}/verified/bloom-triad
            ${{ runner.temp }}/verified-w0/bloom-triad
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  disposable-conformance:
    needs: build-candidate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: bloom
      - name: Reject mutable sibling refs
        shell: bash
        env:
          BROKER_REF: ${{ inputs.broker_ref || '81b30c0725200c97db0d3ab67299c617f31f30ad' }}
          SIGNER_REF: ${{ inputs.signer_ref || '104cf2183b3b33224ef79caab091bcc80875dd9d' }}
        run: |
          [[ "$BROKER_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SIGNER_REF" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ inputs.broker_ref || '81b30c0725200c97db0d3ab67299c617f31f30ad' }}
          path: bloom-broker
      - name: Check out Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ inputs.signer_ref || '104cf2183b3b33224ef79caab091bcc80875dd9d' }}
          path: bloom-signer
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Configure shared W0 acceptance directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bloom-w0-target" >> "$GITHUB_ENV"
      - name: Restore W0 build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bloom-w0-target
          key: >-
            macos-w0-target-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('bloom/Cargo.lock', 'bloom-broker/Cargo.lock',
            'bloom-signer/Cargo.lock') }}
      - name: Download verified macOS candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos-conformance-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}

      # The candidate crosses jobs through the artifact store, which does not
      # preserve executable bits; the installer refuses a payload whose
      # binaries cannot run. Restore the modes the bundle recorded.
      - name: Restore candidate executable modes
        shell: bash
        run: |
          chmod 0755 \
            "$RUNNER_TEMP/verified/bloom-triad/bin/"{bloom,bloom-broker,bloom-signer,bloom-signer-migrate} \
            "$RUNNER_TEMP/verified-w0/bloom-triad/bin/"{bloom,bloom-broker,bloom-signer,bloom-signer-migrate}

      - name: Prove disposable host prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          login_uid="$(id -u)"
          sudo launchctl print "gui/$login_uid" >/dev/null
          printf '%s\n' bloom-macos-unix-w0-disposable-v1 |
            sudo tee /private/var/db/bloom-w0-disposable-host >/dev/null
          sudo chown root:wheel /private/var/db/bloom-w0-disposable-host
          sudo chmod 0644 /private/var/db/bloom-w0-disposable-host
          sudo /usr/sbin/systemsetup -setusingnetworktime on
          sudo /usr/sbin/systemsetup -getusingnetworktime |
            grep -Fx "Network Time: On"
          sudo /bin/launchctl print system/com.apple.timed >/dev/null
          sudo install \
            -o root \
            -g wheel \
            -m 0644 \
            "$RUNNER_TEMP/verified-w0/bloom-triad/RELEASE_PUBLIC_KEY.pem" \
            /private/var/db/bloom-w0-release-key.pem

      - name: Run destructive W0 isolation checks
        shell: bash
        run: |
          set -Eeuo pipefail
          login_uid="$(id -u)"
          login_user="$(id -un)"
          mkdir "$RUNNER_TEMP/macos-w0-evidence"
          sudo env \
            BLOOM_RUN_MACOS_UNIX_W0=true \
            BLOOM_RELEASE_PUBLIC_KEY=/private/var/db/bloom-w0-release-key.pem \
            BLOOM_MACOS_INSTALLED_ACCEPTANCE_MAIN_ROOT="$GITHUB_WORKSPACE/bloom" \
            BLOOM_MACOS_INSTALLED_ACCEPTANCE_BROKER_ROOT="$GITHUB_WORKSPACE/bloom-broker" \
            BLOOM_MACOS_INSTALLED_ACCEPTANCE_SIGNER_ROOT="$GITHUB_WORKSPACE/bloom-signer" \
            BLOOM_MACOS_W0_EVIDENCE_DIR="$RUNNER_TEMP/macos-w0-evidence" \
            BLOOM_MACOS_ACCEPTANCE_CARGO="$(command -v cargo)" \
            BLOOM_MACOS_ACCEPTANCE_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            BLOOM_MACOS_ACCEPTANCE_RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            bloom/tests/conformance/macos-unix-principals/run-disposable.sh \
            "$RUNNER_TEMP/verified-w0/bloom-triad" \
            "$login_uid" \
            "$login_user"

      - name: Record tested release subject
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$RUNNER_TEMP/verified-w0/bloom-triad"
          subject="$(
            bloom/packaging/triad/release/macos-conformance-subject.sh \
              "$payload"
          )"
          archive_sha="$(
            shasum -a 256 \
              "$RUNNER_TEMP/triad-dist/bloom-triad-macos-unix-principals-w0.tar.gz" |
              awk '{print $1}'
          )"
          {
            printf 'schema=bloom.macos-w0-subject.1\n'
            printf 'release_subject_digest=%s\n' "$subject"
            printf 'w0_candidate_archive_sha256=%s\n' "$archive_sha"
            cat "$payload/SOURCE_REVISIONS"
          } > "$RUNNER_TEMP/macos-w0-subject.txt"

      - name: Upload W0 subject evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-w0-subject-${{ github.sha }}
          path: ${{ runner.temp }}/macos-w0-subject.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload digest-bound W0 criteria
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-w0-criteria-${{ github.sha }}
          path: ${{ runner.temp }}/macos-w0-evidence/*.pass
          if-no-files-found: error
          retention-days: 30

      - name: Upload W0 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-w0-failure-${{ github.sha }}
          path: ${{ runner.temp }}/macos-w0-evidence/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove W0 host markers
        if: always()
        shell: bash
        run: |
          sudo rm -f \
            /private/var/db/bloom-w0-disposable-host \
            /private/var/db/bloom-w0-release-key.pem
