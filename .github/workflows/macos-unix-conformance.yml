name: macOS sentinel quota probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Compare GUI lookup before and after the sentinel process limit
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'login UID: %s\n' "$(id -u)"
          printf 'existing login processes: '
          ps -U "$(id -u)" -o pid= | wc -l
          cat > "$RUNNER_TEMP/sentinel-quota-probe.c" <<'C'
          #include <spawn.h>
          #include <sys/resource.h>
          #include <sys/wait.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          extern char **environ;
          static int probe(const char *phase) {
              char target[64];
              snprintf(target, sizeof(target), "gui/%u", (unsigned)geteuid());
              char *args[] = {"/bin/launchctl", "print", target, NULL};
              posix_spawn_file_actions_t actions;
              posix_spawn_file_actions_init(&actions);
              posix_spawn_file_actions_addopen(&actions, 0, "/dev/null", O_RDONLY, 0);
              posix_spawn_file_actions_addopen(&actions, 1, "/dev/null", O_WRONLY, 0);
              posix_spawn_file_actions_addopen(&actions, 2, "/dev/null", O_WRONLY, 0);
              pid_t child;
              int error = posix_spawn(&child, args[0], &actions, NULL, args, environ);
              posix_spawn_file_actions_destroy(&actions);
              if (error) {
                  printf("%s spawn_errno=%d message=%s\n", phase, error, strerror(error));
                  return error;
              }
              int status;
              if (waitpid(child, &status, 0) != child) return 65;
              int code = WIFEXITED(status) ? WEXITSTATUS(status) : 128;
              printf("%s spawn_errno=0 exit=%d\n", phase, code);
              return code;
          }
          int main(void) {
              if (geteuid() == 0) return 65;
              struct rlimit initial;
              if (getrlimit(RLIMIT_NPROC, &initial)) return 65;
              printf("original_nproc soft=%llu hard=%llu\n",
                     (unsigned long long)initial.rlim_cur,
                     (unsigned long long)initial.rlim_max);
              if (probe("baseline")) return 65;
              struct rlimit constrained = {.rlim_cur = 16, .rlim_max = 16};
              if (setrlimit(RLIMIT_NPROC, &constrained)) return 65;
              int result = probe("sentinel_limit");
              printf("constrained_lookup_%s\n", result ? "refused" : "accepted");
              return 0;
          }
          C
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/sentinel-quota-probe.c" -o "$RUNNER_TEMP/sentinel-quota-probe"
          "$RUNNER_TEMP/sentinel-quota-probe"
