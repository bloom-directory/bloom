name: macOS release candidate

# Manual-only: GitHub-hosted macOS minutes are expensive. This produces the
# macOS equivalent of triad-linux-x86_64-candidate in one standard runner job.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  build:
    name: Build and test macOS aarch64 candidate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: bloom
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve locked triad
        id: triad
        working-directory: bloom
        shell: bash
        run: |
          set -euo pipefail
          uname -m | grep -Fx arm64
          matrix=packaging/triad/release/compatibility-v1.toml
          broker_sha="$(sed -n -E 's/^broker_commit = "([0-9a-f]{40})"$/\1/p' "$matrix")"
          signer_sha="$(sed -n -E 's/^signer_commit = "([0-9a-f]{40})"$/\1/p' "$matrix")"
          [[ "$broker_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$signer_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'broker_sha=%s\nsigner_sha=%s\n' "$broker_sha" "$signer_sha" >> "$GITHUB_OUTPUT"

      - name: Check out locked Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ steps.triad.outputs.broker_sha }}
          path: bloom-broker
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ steps.triad.outputs.signer_sha }}
          path: bloom-signer
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Configure shared build directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/macos-release-target" >> "$GITHUB_ENV"

      - name: Restore release build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/macos-release-target
          key: >-
            macos-release-candidate-arm64-${{
            hashFiles('bloom/Cargo.lock', 'bloom-broker/Cargo.lock',
            'bloom-signer/Cargo.lock') }}

      - name: Run locked release gate
        working-directory: bloom
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          packaging/triad/release/triad-release-gate.sh \
            --test-signing-key \
            --output-dir "$RUNNER_TEMP/candidate"
          work="$(mktemp -d "$RUNNER_TEMP/macos-candidate-check.XXXXXX")"
          trap 'find "$work" -depth -delete' EXIT
          tar -xzf "$RUNNER_TEMP/candidate/bloom-triad-test-unclaimed.tar.gz" -C "$work"
          for binary in bloom bloom-broker bloom-signer bloom-signer-migrate; do
            file -b "$work/bloom-triad/bin/$binary" |
              grep -F 'Mach-O 64-bit executable arm64' >/dev/null
          done

      - name: Upload verified macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triad-macos-aarch64-candidate
          path: ${{ runner.temp }}/candidate/bloom-triad-test-unclaimed.tar.gz*
          if-no-files-found: error
          retention-days: 3
