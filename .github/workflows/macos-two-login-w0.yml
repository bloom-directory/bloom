name: macOS two-login Unix-principal W0

on:
  workflow_call:
    inputs:
      broker_ref:
        description: Public bloom-broker ref
        required: false
        type: string
        default: bdf5d36b48f6a476539ff992084c483becd67629
      signer_ref:
        description: Public bloom-signer ref
        required: false
        type: string
        default: a9dcbbfef8a4057b9e6f94b17e010f051f7ab32e
      login_uid_a:
        description: First active GUI login UID
        required: true
        type: string
      login_user_a:
        description: First active GUI login name
        required: true
        type: string
      login_uid_b:
        description: Second active GUI login UID
        required: true
        type: string
      login_user_b:
        description: Second active GUI login name
        required: true
        type: string
  workflow_dispatch:
    inputs:
      broker_ref:
        description: Public bloom-broker ref
        required: true
        default: bdf5d36b48f6a476539ff992084c483becd67629
      signer_ref:
        description: Public bloom-signer ref
        required: true
        default: a9dcbbfef8a4057b9e6f94b17e010f051f7ab32e
      login_uid_a:
        description: First active GUI login UID
        required: true
      login_user_a:
        description: First active GUI login name
        required: true
      login_uid_b:
        description: Second active GUI login UID
        required: true
      login_user_b:
        description: Second active GUI login name
        required: true

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  two-login:
    runs-on: [self-hosted, macOS, bloom-two-login-disposable]
    timeout-minutes: 90
    env:
      BLOOM_W0_LOGIN_UID_A: ${{ inputs.login_uid_a }}
      BLOOM_W0_LOGIN_USER_A: ${{ inputs.login_user_a }}
      BLOOM_W0_LOGIN_UID_B: ${{ inputs.login_uid_b }}
      BLOOM_W0_LOGIN_USER_B: ${{ inputs.login_user_b }}
    steps:
      - name: Check out candidate Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: bloom
      - name: Reject mutable sibling refs
        shell: bash
        env:
          BROKER_REF: ${{ inputs.broker_ref || 'bdf5d36b48f6a476539ff992084c483becd67629' }}
          SIGNER_REF: ${{ inputs.signer_ref || 'a9dcbbfef8a4057b9e6f94b17e010f051f7ab32e' }}
        run: |
          [[ "$BROKER_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SIGNER_REF" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ inputs.broker_ref || 'bdf5d36b48f6a476539ff992084c483becd67629' }}
          path: bloom-broker
      - name: Check out Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ inputs.signer_ref || 'a9dcbbfef8a4057b9e6f94b17e010f051f7ab32e' }}
          path: bloom-signer
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build baseline, candidate, and activation-failing payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          for manifest_and_package in \
            "bloom/Cargo.toml bloom" \
            "bloom-broker/Cargo.toml bloom-broker" \
            "bloom-signer/Cargo.toml bloom-signer" \
            "bloom-signer/Cargo.toml bloom-signer-migrate"
          do
            manifest="${manifest_and_package%% *}"
            package="${manifest_and_package#* }"
            CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" \
              cargo build \
              --manifest-path "$manifest" \
              --release \
              -p "$package" \
              --locked
          done
          /usr/bin/ssh-keygen \
            -q \
            -t ed25519 \
            -N '' \
            -f "$RUNNER_TEMP/w0-release-key"

          for name in baseline candidate failing; do
            mkdir -p \
              "$RUNNER_TEMP/$name-staging/bin" \
              "$RUNNER_TEMP/$name-dist" \
              "$RUNNER_TEMP/$name-verified"
          done
          cp "$RUNNER_TEMP/candidate-target/release/bloom" \
            "$RUNNER_TEMP/baseline-staging/bin/bloom"
          cp "$RUNNER_TEMP/candidate-target/release/bloom" \
            "$RUNNER_TEMP/candidate-staging/bin/bloom"
          cp "$RUNNER_TEMP/candidate-target/release/bloom" \
            "$RUNNER_TEMP/failing-staging/bin/bloom"
          for name in baseline candidate; do
            cp "$RUNNER_TEMP/candidate-target/release/bloom-broker" \
              "$RUNNER_TEMP/$name-staging/bin/bloom-broker"
          done
          for name in baseline candidate failing; do
            cp "$RUNNER_TEMP/candidate-target/release/bloom-signer" \
              "$RUNNER_TEMP/$name-staging/bin/bloom-signer"
            cp "$RUNNER_TEMP/candidate-target/release/bloom-signer-migrate" \
              "$RUNNER_TEMP/$name-staging/bin/bloom-signer-migrate"
          done
          printf '%s\n' bloom-valid-digest-distinct-baseline-v1 \
            > "$RUNNER_TEMP/baseline-staging/W0_BASELINE_VARIANT"

          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <string.h>' \
            'int main(int argc, char **argv) {' \
            '  if (argc == 2 && strcmp(argv[1], "--version") == 0) {' \
            '    puts("bloom-broker 0.1.0");' \
            '    return 0;' \
            '  }' \
            '  fputs("intentional W0 activation failure\\n", stderr);' \
            '  return 70;' \
            '}' > "$RUNNER_TEMP/failing-broker.c"
          xcrun clang \
            -Os \
            "$RUNNER_TEMP/failing-broker.c" \
            -o "$RUNNER_TEMP/failing-staging/bin/bloom-broker"
          codesign \
            --force \
            --sign - \
            "$RUNNER_TEMP/failing-staging/bin/bloom-broker"

          build_payload() {
            name="$1"
            source_root="$2"
            export BLOOM_PLATFORM_CLAIM=macos-unix-principals-w0
            export BLOOM_ALLOW_MACOS_UNIX_W0=true
            export BLOOM_MACHINE_SHA
            export BLOOM_BROKER_SHA
            export BLOOM_SIGNER_SHA
            BLOOM_MACHINE_SHA="$(git -C "$source_root" rev-parse HEAD)"
            BLOOM_BROKER_SHA="$(git -C bloom-broker rev-parse HEAD)"
            BLOOM_SIGNER_SHA="$(git -C bloom-signer rev-parse HEAD)"
            "$source_root/packaging/triad/release/build-bundle.sh" \
              "$RUNNER_TEMP/$name-staging" \
              "$RUNNER_TEMP/$name-dist/bloom-triad.tar.gz" \
              "$RUNNER_TEMP/w0-release-key" \
              1700000000
            "$source_root/packaging/triad/release/verify-bundle.sh" \
              "$RUNNER_TEMP/$name-dist/bloom-triad.tar.gz" \
              "$RUNNER_TEMP/$name-dist/bloom-triad.tar.gz.sha256" \
              "$RUNNER_TEMP/$name-dist/bloom-triad.tar.gz.sig" \
              "$RUNNER_TEMP/$name-dist/bloom-triad.tar.gz.pub"
            tar -xzf \
              "$RUNNER_TEMP/$name-dist/bloom-triad.tar.gz" \
              -C "$RUNNER_TEMP/$name-verified"
          }

          build_payload baseline bloom
          build_payload candidate bloom
          build_payload failing bloom

      - name: Prove disposable two-login host prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e /private/var/db/bloom-w0-disposable-host
          test "$(id -u)" != "$BLOOM_W0_LOGIN_UID_A"
          test "$(id -u)" != "$BLOOM_W0_LOGIN_UID_B"
          sudo launchctl print "gui/$BLOOM_W0_LOGIN_UID_A" >/dev/null
          sudo launchctl print "gui/$BLOOM_W0_LOGIN_UID_B" >/dev/null
          printf '%s\n' bloom-macos-unix-w0-disposable-v1 |
            sudo tee /private/var/db/bloom-w0-disposable-host >/dev/null
          sudo chown root:wheel /private/var/db/bloom-w0-disposable-host
          sudo chmod 0644 /private/var/db/bloom-w0-disposable-host
          sudo install \
            -o root \
            -g wheel \
            -m 0644 \
            "$RUNNER_TEMP/candidate-verified/bloom-triad/RELEASE_PUBLIC_KEY.pem" \
            /private/var/db/bloom-w0-release-key.pem
          mkdir "$RUNNER_TEMP/macos-two-login-evidence"

      - name: Run destructive two-login lifecycle and upgrade checks
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo env \
            BLOOM_RUN_MACOS_UNIX_W0=true \
            BLOOM_RELEASE_PUBLIC_KEY=/private/var/db/bloom-w0-release-key.pem \
            BLOOM_MACOS_W0_EVIDENCE_DIR="$RUNNER_TEMP/macos-two-login-evidence" \
            bloom/packaging/triad/macos/w0/run-two-login.sh \
            "$RUNNER_TEMP/baseline-verified/bloom-triad" \
            "$BLOOM_W0_LOGIN_UID_A" \
            "$BLOOM_W0_LOGIN_USER_A" \
            "$BLOOM_W0_LOGIN_UID_B" \
            "$BLOOM_W0_LOGIN_USER_B" \
            "$RUNNER_TEMP/candidate-verified/bloom-triad" \
            "$RUNNER_TEMP/failing-verified/bloom-triad"

      - name: Upload digest-bound two-login criteria
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-two-login-criteria-${{ github.sha }}
          path: ${{ runner.temp }}/macos-two-login-evidence/*.pass
          if-no-files-found: error
          retention-days: 30

      - name: Remove W0 host markers
        if: always()
        shell: bash
        run: |
          sudo rm -f \
            /private/var/db/bloom-w0-disposable-host \
            /private/var/db/bloom-w0-release-key.pem
