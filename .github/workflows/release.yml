name: Release

# Dry runs build unsigned test candidates for every supported target.
# Version tags build, production-sign, and publish all artifacts together.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build exactly or retry (for example v0.3.0).'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build test candidates only. No production signing or GitHub Release.'
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  prepare:
    name: Resolve locked triad
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      broker_sha: ${{ steps.meta.outputs.broker_sha }}
      signer_sha: ${{ steps.meta.outputs.signer_sha }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch --tags --force
          if [[ "$DRY_RUN" == "true" ]]; then
            [[ "$EVENT_NAME" == "workflow_dispatch" ]] || {
              echo "::error::release dry runs require workflow_dispatch"
              exit 1
            }
            if [[ -n "$tag" ]]; then
              if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::release tag must match vX.Y.Z, got: $tag"
                exit 1
              fi
              git rev-parse -q --verify "refs/tags/$tag" >/dev/null || {
                echo "::error::release tag does not exist: $tag"
                exit 1
              }
              release_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            else
              release_sha="$(git rev-parse "$EVENT_SHA^{commit}")"
            fi
          else
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::release tag must match vX.Y.Z, got: $tag"
              exit 1
            fi
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || {
              echo "::error::release tag does not exist: $tag"
              exit 1
            }
            release_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            # Supplied by the step environment above.
            # shellcheck disable=SC2153
            event_sha="$(git rev-parse "$EVENT_SHA^{commit}")"
            if [[ "$EVENT_NAME" == "push" ]]; then
              [[ "$release_sha" == "$event_sha" ]] || {
                echo "::error::production release runs must originate from the tagged commit"
                exit 1
              }
            else
              [[ "$EVENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
                echo "::error::production release retries must run from $DEFAULT_BRANCH"
                exit 1
              }
            fi
            git fetch --force origin \
              "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              default_sha="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")"
              [[ "$event_sha" == "$default_sha" ]] || {
                echo "::error::production release retries must use the current $DEFAULT_BRANCH commit"
                exit 1
              }
            fi
            git merge-base --is-ancestor \
              "$release_sha" \
              "refs/remotes/origin/$DEFAULT_BRANCH" || {
              echo "::error::$tag is not on $DEFAULT_BRANCH"
              exit 1
            }
          fi

          workspace_version="$(git show "$release_sha:Cargo.toml" |
            sed -n -E 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' |
            head -n 1)"
          if [[ "$DRY_RUN" == "true" ]]; then
            version="$workspace_version"
            tag="dry-run-v$version"
          else
            version="${tag#v}"
          fi
          matrix="$(git show "$release_sha:packaging/triad/release/compatibility-v1.toml")"
          machine_version="$(sed -n -E 's/^machine = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' <<<"$matrix")"
          broker_sha="$(sed -n -E 's/^broker_commit = "([0-9a-f]{40})"$/\1/p' <<<"$matrix")"
          signer_sha="$(sed -n -E 's/^signer_commit = "([0-9a-f]{40})"$/\1/p' <<<"$matrix")"
          if [[ "$workspace_version" != "$version" || "$machine_version" != "$version" ]]; then
            echo "::error::$tag must match both the workspace and triad matrix versions"
            exit 1
          fi
          [[ -n "$broker_sha" && -n "$signer_sha" ]] || {
            echo "::error::triad matrix must pin full Broker and Signer commit IDs"
            exit 1
          }
          source_date_epoch="$(git show -s --format=%ct "$release_sha")"
          {
            echo "release_tag=$tag"
            echo "release_version=$version"
            echo "release_sha=$release_sha"
            echo "source_date_epoch=$source_date_epoch"
            echo "broker_sha=$broker_sha"
            echo "signer_sha=$signer_sha"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and test Linux x86_64 candidate
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: bloom
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ needs.prepare.outputs.broker_sha }}
          path: bloom-broker
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ needs.prepare.outputs.signer_sha }}
          path: bloom-signer
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            bloom
            bloom-broker
            bloom-signer

      - name: Build signed Linux candidate
        working-directory: bloom
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          packaging/triad/release.sh build linux \
            --output-dir "$RUNNER_TEMP/candidate"

      - name: Upload verified unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triad-linux-x86_64-candidate
          path: ${{ runner.temp }}/candidate/bloom-triad-test-unclaimed.tar.gz*
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build and test macOS aarch64 candidate
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: bloom
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ needs.prepare.outputs.broker_sha }}
          path: bloom-broker
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ needs.prepare.outputs.signer_sha }}
          path: bloom-signer
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Configure shared build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/macos-release-target" >> "$GITHUB_ENV"

      - name: Restore release build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/macos-release-target
          key: >-
            macos-release-candidate-arm64-${{
            hashFiles('bloom/Cargo.lock', 'bloom-broker/Cargo.lock',
            'bloom-signer/Cargo.lock') }}

      - name: Build signed macOS candidate
        working-directory: bloom
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          uname -m | grep -Fx arm64
          packaging/triad/release.sh build macos \
            --output-dir "$RUNNER_TEMP/candidate"

      - name: Upload verified macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triad-macos-aarch64-candidate
          path: ${{ runner.temp }}/candidate/bloom-triad-test-unclaimed.tar.gz*
          if-no-files-found: error
          retention-days: 3

  build-linux-aarch64:
    name: Build and test Linux aarch64 candidate
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: bloom
          fetch-depth: 0
          persist-credentials: false

      - name: Check out release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: release-tools
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ needs.prepare.outputs.broker_sha }}
          path: bloom-broker
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ needs.prepare.outputs.signer_sha }}
          path: bloom-signer
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            bloom
            bloom-broker
            bloom-signer

      - name: Add reviewed aarch64 release tooling to the locked source
        run: |
          set -euo pipefail
          git -C bloom diff --quiet HEAD
          git -C release-tools diff --quiet HEAD
          git -C bloom update-index --assume-unchanged packaging/triad/release.sh
          install -m 0755 release-tools/packaging/triad/release.sh \
            bloom/packaging/triad/release.sh

      - name: Build signed Linux aarch64 candidate
        working-directory: bloom
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          uname -m | grep -Fx aarch64
          packaging/triad/release.sh build linux-aarch64 \
            --output-dir "$RUNNER_TEMP/candidate"

      - name: Upload verified Linux aarch64 candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triad-linux-aarch64-candidate
          path: ${{ runner.temp }}/candidate/bloom-triad-test-unclaimed.tar.gz*
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign reviewed candidates
    needs: [prepare, build, build-macos, build-linux-aarch64]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: read
    steps:
      - name: Check out release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: triad-linux-x86_64-candidate
          path: candidate/linux

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: triad-macos-aarch64-candidate
          path: candidate/macos

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: triad-linux-aarch64-candidate
          path: candidate/linux-aarch64

      - name: Re-sign candidate without executing it
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.TRIAD_RELEASE_SIGNING_KEY }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_SIGNING_KEY" ]] || {
            echo "::error::configure TRIAD_RELEASE_SIGNING_KEY in the production-release environment"
            exit 1
          }
          umask 077
          signing_key="$(mktemp "$RUNNER_TEMP/bloom-release-key.XXXXXX")"
          trap 'rm -f -- "$signing_key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$signing_key"
          unset RELEASE_SIGNING_KEY
          packaging/triad/release.sh sign linux \
            candidate/linux/bloom-triad-test-unclaimed.tar.gz \
            --output-dir signed \
            --signing-key "$signing_key" \
            --pinned-public-key packaging/triad/release/bloom-release-v1.pub \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --version '${{ needs.prepare.outputs.release_version }}' \
            --machine-sha '${{ needs.prepare.outputs.release_sha }}' \
            --broker-sha '${{ needs.prepare.outputs.broker_sha }}' \
            --signer-sha '${{ needs.prepare.outputs.signer_sha }}'
          packaging/triad/release.sh sign macos \
            candidate/macos/bloom-triad-test-unclaimed.tar.gz \
            --output-dir signed \
            --signing-key "$signing_key" \
            --pinned-public-key packaging/triad/release/bloom-release-v1.pub \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --version '${{ needs.prepare.outputs.release_version }}' \
            --machine-sha '${{ needs.prepare.outputs.release_sha }}' \
            --broker-sha '${{ needs.prepare.outputs.broker_sha }}' \
            --signer-sha '${{ needs.prepare.outputs.signer_sha }}'
          packaging/triad/release.sh sign linux-aarch64 \
            candidate/linux-aarch64/bloom-triad-test-unclaimed.tar.gz \
            --output-dir signed \
            --signing-key "$signing_key" \
            --pinned-public-key packaging/triad/release/bloom-release-v1.pub \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --version '${{ needs.prepare.outputs.release_version }}' \
            --machine-sha '${{ needs.prepare.outputs.release_sha }}' \
            --broker-sha '${{ needs.prepare.outputs.broker_sha }}' \
            --signer-sha '${{ needs.prepare.outputs.signer_sha }}'
          rm -f -- "$signing_key"
          trap - EXIT

      - name: Verify signed archive against reviewed key
        run: |
          packaging/triad/release/verify-bundle.sh \
            signed/bloom-triad-linux-x86_64.tar.gz \
            signed/bloom-triad-linux-x86_64.tar.gz.sha256 \
            signed/bloom-triad-linux-x86_64.tar.gz.sig \
            packaging/triad/release/bloom-release-v1.pub
          cmp \
            packaging/triad/release/bloom-release-v1.pub \
            signed/bloom-triad-linux-x86_64.tar.gz.pub
          packaging/triad/release/verify-bundle.sh \
            signed/bloom-triad-linux-aarch64.tar.gz \
            signed/bloom-triad-linux-aarch64.tar.gz.sha256 \
            signed/bloom-triad-linux-aarch64.tar.gz.sig \
            packaging/triad/release/bloom-release-v1.pub
          cmp \
            packaging/triad/release/bloom-release-v1.pub \
            signed/bloom-triad-linux-aarch64.tar.gz.pub
          packaging/triad/release/verify-bundle.sh \
            signed/bloom-triad-macos-aarch64.tar.gz \
            signed/bloom-triad-macos-aarch64.tar.gz.sha256 \
            signed/bloom-triad-macos-aarch64.tar.gz.sig \
            packaging/triad/release/bloom-release-v1.pub
          cmp \
            packaging/triad/release/bloom-release-v1.pub \
            signed/bloom-triad-macos-aarch64.tar.gz.pub

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triad-signed-release
          path: signed/bloom-triad-*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, sign]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: triad-signed-release
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
          SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag_sha="$(git rev-parse "$TAG^{commit}")"
          [[ "$tag_sha" == "$SHA" ]] || {
            echo "::error::$TAG moved after the build"
            exit 1
          }
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          ## Bloom v$VERSION

          This release contains signed Bloom triad bundles for Linux x86_64,
          Linux aarch64, and macOS aarch64.

          Verify the archive checksum signature with the reviewed key at
          \`packaging/triad/release/bloom-release-v1.pub\` and the namespace
          \`bloom-release-archive-v1\`.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              > "$existing/names"
            for asset in dist/*; do basename "$asset"; done |
              LC_ALL=C sort > "$existing/expected-names"
            LC_ALL=C sort -u "$existing/names" > "$existing/names.sorted"
            LC_ALL=C comm -23 \
              "$existing/names.sorted" \
              "$existing/expected-names" \
              > "$existing/unexpected-names"
            if [[ -s "$existing/unexpected-names" ]]; then
              echo "::error::release contains unexpected assets"
              cat "$existing/unexpected-names"
              exit 1
            fi
            for asset in dist/*; do
              name="$(basename "$asset")"
              if grep -Fqx -- "$name" "$existing/names"; then
                gh release download "$TAG" --pattern "$name" --dir "$existing"
                cmp "$asset" "$existing/$name" || {
                  echo "::error::published asset $name is immutable and differs from this retry"
                  exit 1
                }
              else
                gh release upload "$TAG" "$asset"
              fi
            done
            release_id="$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .id)"
            gh api --method PATCH \
              "repos/$REPOSITORY/releases/$release_id" \
              -f name="Bloom v$VERSION" \
              -f body="$(<"$notes")" \
              -F prerelease=false \
              -f make_latest=true
            echo "Existing assets are byte-identical; missing assets were uploaded."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Bloom v$VERSION" \
              --notes-file "$notes" \
              dist/*
          fi
