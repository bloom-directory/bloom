name: Release

# Tag-driven release workflow. Mirrors the structure of vibefi/client's
# release.yml but adapted to this repo: no cargo-packager, four native
# runners (no --target cross-compile), per-binary verify step, and a
# committed workspace version bump (no --config magic, no cargo-edit).
#
# Flow:
#   1. `prepare` resolves and validates the tag (vX.Y.Z).
#   2. `prepare_release` either validates that an existing tag already
#      points at a version-bumped commit, or (for workflow_dispatch)
#      creates the bump commit and tag together. It also mirrors the
#      immutable release SHA to `release/vX.Y.Z` for maintainers.
#   3. `build` checks out that exact SHA and runs `cargo build --locked`
#      on each of the four native runners. A verify step asserts that
#      `bloom --version` matches the tag.
#   4. `publish` verifies the tag still resolves to the built SHA,
#      downloads the four tarballs, generates SHA256SUMS, and creates
#      or updates the GitHub release for that existing tag.
#
# The floating `latest` git tag is intentionally NOT touched here.
# GitHub's `/releases/latest/download/<file>` route follows whichever
# release is marked latest; it does not require a git tag named `latest`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or retry (e.g. v0.1.1).'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      release_ref: ${{ steps.meta.outputs.release_ref }}
      tag_exists: ${{ steps.meta.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::release tag must match vX.Y.Z, got: $TAG"
            exit 1
          fi
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=true
            REF="refs/tags/$TAG"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_EXISTS=false
            REF="refs/heads/${{ github.event.repository.default_branch }}"
          else
            echo "::error::pushed tag does not exist in repository: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "release_tag=$TAG"
            echo "release_version=$VERSION"
            echo "release_ref=$REF"
            echo "tag_exists=$TAG_EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release metadata:"
          echo "  tag: $TAG"
          echo "  version: $VERSION"
          echo "  ref: $REF"
          echo "  tag exists: $TAG_EXISTS"

  prepare_release:
    name: Prepare Release Commit
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      release_branch_sha: ${{ steps.commit.outputs.release_branch_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0
      - name: Validate or bump workspace version
        env:
          TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n -E 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$TAG_EXISTS" == "true" ]]; then
            # Tags are immutable release inputs. A tag-push release must
            # already point at a commit whose workspace version matches it.
            if [[ "$CURRENT_VERSION" != "$VERSION" ]]; then
              echo "::error::tag v$VERSION points at workspace version $CURRENT_VERSION; bump and commit before tagging"
              exit 1
            fi
          else
            # A manual CI-only release starts from the default branch and
            # creates the version commit before creating the tag.
            sed -i -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$VERSION"'"/' Cargo.toml
            cargo update --workspace
            # Sanity: the diff should be exactly Cargo.toml + Cargo.lock.
            # Anything else means cargo touched a transitive dep — investigate.
            git diff --stat
          fi
      - id: commit
        env:
          TAG: ${{ needs.prepare.outputs.release_tag }}
          TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Workspace is already at v$VERSION; using the tagged commit."
          else
            git commit -m "release: v$VERSION"
          fi
          SHA="$(git rev-parse HEAD)"

          if [[ "$TAG_EXISTS" == "true" ]]; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            if [[ "$TAG_SHA" != "$SHA" ]]; then
              echo "::error::tag $TAG resolves to $TAG_SHA, but release commit is $SHA"
              exit 1
            fi
          else
            git tag "$TAG" "$SHA"
          fi

          # Write the SHA output *before* the tag push so a failed
          # tag push (e.g. another actor created it concurrently)
          # doesn't strip downstream jobs of the release commit SHA.
          echo "release_branch_sha=$SHA" >> "$GITHUB_OUTPUT"

          # The release/* branch is workflow-owned; --force is safe.
          git push --force origin "HEAD:refs/heads/release/v$VERSION"
          if [[ "$TAG_EXISTS" == "false" ]]; then
            # A normal (non-force) push fails safely if another actor
            # created the tag after the prepare job checked for it.
            git push origin "refs/tags/$TAG"
          fi
          echo "Prepared $TAG and release/v$VERSION at $SHA"

  build:
    name: build ${{ matrix.asset_name }}
    needs: [prepare, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: bloom-linux-x86_64.tar.gz
            os: ubuntu-latest
            binary: bloom
          - asset_name: bloom-linux-aarch64.tar.gz
            os: ubuntu-24.04-arm
            binary: bloom
          - asset_name: bloom-macos-x86_64.tar.gz
            os: macos-26-intel
            binary: bloom
          - asset_name: bloom-macos-aarch64.tar.gz
            os: macos-26
            binary: bloom
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.release_branch_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build release binary (locked)
        run: cargo build --release -p bloom --all-features --locked

      - name: Verify binary version matches tag
        env:
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          ACTUAL="$(./target/release/${{ matrix.binary }} --version | awk '{print $2}')"
          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "::error::binary version '$ACTUAL' does not match tag '$VERSION'"
            exit 1
          fi
          echo "Verified: ${{ matrix.binary }} --version = $ACTUAL"

      - name: Stage package
        run: |
          set -euo pipefail
          mkdir -p package dist
          cp "target/release/${{ matrix.binary }}" package/
          cp README.md LICENSE package/
          tar -czf "dist/${{ matrix.asset_name }}" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, prepare_release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum bloom-* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
          SHA: ${{ needs.prepare_release.outputs.release_branch_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA="$(git rev-parse "$TAG^{commit}")"
          if [[ "$TAG_SHA" != "$SHA" ]]; then
            echo "::error::refusing to publish: tag $TAG resolves to $TAG_SHA, built SHA is $SHA"
            exit 1
          fi
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          ## bloom v$VERSION

          Automated release for tag \`$TAG\`.

          ### Downloads

          Stable per-version URLs — pick the one for your platform:
          \`\`\`
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-linux-x86_64.tar.gz
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-linux-aarch64.tar.gz
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-macos-x86_64.tar.gz
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-macos-aarch64.tar.gz
          \`\`\`

          Latest-alias URL (resolves to the release marked latest):
          \`\`\`
          https://github.com/${{ github.repository }}/releases/latest/download/bloom-linux-x86_64.tar.gz
          \`\`\`

          Verify your download with \`SHA256SUMS\`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Retry path: release already exists. Update metadata and
            # re-upload assets (clobbering any previous ones).
            gh release edit "$TAG" \
              --title "bloom v$VERSION" \
              --notes-file "$NOTES" \
              --latest
            gh release upload "$TAG" dist/* --clobber
          else
            # First-time create. We do NOT pass `--verify-tag` because
            # the CI-only path creates a *lightweight* tag above
            # (`git tag "$TAG" "$SHA"` without -a/-s), and `gh
            # release create --verify-tag` runs `git tag --verify`
            # which requires an annotated/signed tag. The earlier
            # TAG_SHA check already guards against tag/SHA drift.
            gh release create "$TAG" \
              --title "bloom v$VERSION" \
              --notes-file "$NOTES" \
              --latest \
              dist/*
          fi
