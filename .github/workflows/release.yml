name: Release

# Tag-driven release workflow. Mirrors the structure of vibefi/client's
# release.yml but adapted to this repo: no cargo-packager, four native
# runners (no --target cross-compile), per-binary verify step, and a
# reviewed workspace version bump (no --config magic, no cargo-edit).
#
# Flow:
#   1. A reviewed version-bump PR is merged, then a maintainer pushes its
#      matching `vX.Y.Z` tag. `propose-release.yml` can open that PR.
#   2. `prepare` resolves and validates the existing tag (vX.Y.Z).
#   3. `build` checks out that exact SHA and runs `cargo build --locked`
#      on each of the four native runners. A verify step asserts that
#      `bloom --version` matches the tag.
#   4. `publish` verifies the tag still resolves to the built SHA,
#      downloads the four tarballs, generates SHA256SUMS, and creates
#      or updates the GitHub release for that existing tag.
#
# The floating `latest` git tag is intentionally NOT touched here.
# GitHub's `/releases/latest/download/<file>` route follows whichever
# release is marked latest; it does not require a git tag named `latest`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to retry (e.g. v0.1.1).'
        required: true
        type: string

# Jobs opt into the minimum permissions they need below. In particular,
# build runners never receive a write-capable token.
permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must match vX.Y.Z, got: $TAG"
            exit 1
          fi
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::pushed tag does not exist in repository: $TAG"
            exit 1
          fi
          REF="refs/tags/$TAG"
          RELEASE_SHA="$(git rev-parse "$REF^{commit}")"
          git fetch --force origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor \
            "$RELEASE_SHA" \
            "refs/remotes/origin/$DEFAULT_BRANCH"
          then
            echo "::error::tag $TAG does not point to a commit on $DEFAULT_BRANCH"
            exit 1
          fi
          VERSION="${TAG#v}"
          CURRENT_VERSION="$(git show "$RELEASE_SHA:Cargo.toml" | sed -n -E 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' | head -n 1)"
          if [[ "$CURRENT_VERSION" != "$VERSION" ]]; then
            echo "::error::tag $TAG points at workspace version $CURRENT_VERSION; merge the reviewed version bump before tagging"
            exit 1
          fi
          {
            echo "release_tag=$TAG"
            echo "release_version=$VERSION"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release metadata:"
          echo "  tag: $TAG"
          echo "  version: $VERSION"
          echo "  ref: $REF"
          echo "  sha: $RELEASE_SHA"
          echo "  workspace version: $CURRENT_VERSION"

  test:
    name: test tagged release
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run workspace tests (locked)
        run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.asset_name }}
    needs: [prepare, test]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: bloom-linux-x86_64.tar.gz
            os: ubuntu-latest
            binary: bloom
          - asset_name: bloom-linux-aarch64.tar.gz
            os: ubuntu-24.04-arm
            binary: bloom
          - asset_name: bloom-macos-x86_64.tar.gz
            os: macos-26-intel
            binary: bloom
          - asset_name: bloom-macos-aarch64.tar.gz
            os: macos-26
            binary: bloom
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Build release binary (locked)
        run: cargo build --release -p bloom --all-features --locked

      - name: Verify binary version matches tag
        env:
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          ACTUAL="$(./target/release/${{ matrix.binary }} --version | awk '{print $2}')"
          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "::error::binary version '$ACTUAL' does not match tag '$VERSION'"
            exit 1
          fi
          echo "Verified: ${{ matrix.binary }} --version = $ACTUAL"

      - name: Stage package
        run: |
          set -euo pipefail
          mkdir -p package dist
          cp "target/release/${{ matrix.binary }}" package/
          cp README.md LICENSE package/
          tar -czf "dist/${{ matrix.asset_name }}" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum bloom-* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
          SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA="$(git rev-parse "$TAG^{commit}")"
          if [[ "$TAG_SHA" != "$SHA" ]]; then
            echo "::error::refusing to publish: tag $TAG resolves to $TAG_SHA, built SHA is $SHA"
            exit 1
          fi
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          ## bloom v$VERSION

          Automated release for tag \`$TAG\`.

          ### Downloads

          Stable per-version URLs — pick the one for your platform:
          \`\`\`
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-linux-x86_64.tar.gz
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-linux-aarch64.tar.gz
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-macos-x86_64.tar.gz
          https://github.com/${{ github.repository }}/releases/download/$TAG/bloom-macos-aarch64.tar.gz
          \`\`\`

          Latest-alias URL (resolves to the release marked latest):
          \`\`\`
          https://github.com/${{ github.repository }}/releases/latest/download/bloom-linux-x86_64.tar.gz
          \`\`\`

          Verify your download with \`SHA256SUMS\`.
          EOF

          LATEST_ERROR="$(mktemp)"
          if CURRENT_LATEST="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>"$LATEST_ERROR")"; then
            :
          else
            GH_STATUS=$?
            if grep -q 'HTTP 404' "$LATEST_ERROR"; then
              CURRENT_LATEST=""
              echo "No eligible published release exists yet; considering $TAG for latest."
            else
              cat "$LATEST_ERROR" >&2
              echo "::error::failed to resolve the current latest release; refusing to publish"
              exit "$GH_STATUS"
            fi
          fi
          version_at_least() {
            local left right lpart rpart
            IFS=. read -r -a left <<< "${1#v}"
            IFS=. read -r -a right <<< "${2#v}"
            for i in 0 1 2; do
              lpart=$((10#${left[$i]}))
              rpart=$((10#${right[$i]}))
              if (( lpart > rpart )); then return 0; fi
              if (( lpart < rpart )); then return 1; fi
            done
            return 0
          }
          MARK_LATEST=false
          if [[ -z "$CURRENT_LATEST" || "$CURRENT_LATEST" == "latest" ]]; then
            MARK_LATEST=true
          elif [[ "$CURRENT_LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            && version_at_least "$TAG" "$CURRENT_LATEST"; then
            MARK_LATEST=true
          fi
          echo "Current latest release: ${CURRENT_LATEST:-none}"
          echo "Marking $TAG latest: $MARK_LATEST"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Retry path: release already exists. Use the REST API because
            # `gh release edit` can mark a release latest but cannot explicitly
            # demote one that was previously marked latest.
            RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id')"
            gh api --method PATCH \
              "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -f name="bloom v$VERSION" \
              -f body="$(<"$NOTES")" \
              -f make_latest="$MARK_LATEST"
            gh release upload "$TAG" dist/* --clobber
          else
            # First-time create. `--verify-tag` checks that the tag
            # already exists in the remote repository; lightweight tags
            # are supported. Together with the TAG_SHA comparison above,
            # this prevents `gh` from creating a missing tag from the
            # default branch after the build has completed.
            gh release create "$TAG" \
              --verify-tag \
              --title "bloom v$VERSION" \
              --notes-file "$NOTES" \
              --latest="$MARK_LATEST" \
              dist/*
          fi
