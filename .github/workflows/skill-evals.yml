name: Skill evals

on:
  pull_request:
    paths: &skill_paths
      - ".github/workflows/skill-evals.yml"
      - ".claude-plugin/**"
      - "skills/**"
      - "install/**"
      - "evals/skills/**"
  push:
    branches:
      - master
    paths: *skill_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-evals-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: skill-evals-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals/skills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/skills/package-lock.json
      - name: Install Promptfoo
        run: npm ci --no-audit --no-fund
      # Grader fixtures and config validation only; no model calls.
      - name: Check onboarding grader and configs
        run: npm run check
      - name: Check plugin manifests
        working-directory: .
        run: |
          jq -er '.plugins[].source' .claude-plugin/marketplace.json | xargs -I{} test -f {}/.claude-plugin/plugin.json
          jq -e '.name and .version' skills/bloom/.claude-plugin/plugin.json
          # Installed plugins update only when this version changes, so it
          # moves with the skill's version.
          skill="$(sed -n -E 's/^  version: "?([0-9]+\.[0-9]+\.[0-9]+)"?$/\1/p' skills/bloom/SKILL.md)"
          plugin="$(jq -r .version skills/bloom/.claude-plugin/plugin.json)"
          [ -n "$skill" ] && [ "$skill" = "$plugin" ] ||
            { echo "::error::plugin.json version $plugin differs from SKILL.md version $skill"; exit 1; }
