name: macOS Unix-principal W0

on:
  workflow_call:
    inputs:
      broker_ref:
        description: Public bloom-broker ref
        required: false
        type: string
        default: c05d9519b97dc74cf49fb293daf374f8db30c7af
      signer_ref:
        description: Public bloom-signer ref
        required: false
        type: string
        default: 3571bf4dc70919d56e3c3d0d47f005b833960306
  workflow_dispatch:
    inputs:
      broker_ref:
        description: Public bloom-broker ref
        required: true
        default: c05d9519b97dc74cf49fb293daf374f8db30c7af
      signer_ref:
        description: Public bloom-signer ref
        required: true
        default: 3571bf4dc70919d56e3c3d0d47f005b833960306

permissions:
  contents: read

jobs:
  build-w0:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out Machine
        uses: actions/checkout@v4
        with:
          path: bloom
      - name: Check out Broker
        uses: actions/checkout@v4
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ inputs.broker_ref || 'c05d9519b97dc74cf49fb293daf374f8db30c7af' }}
          path: bloom-broker
      - name: Check out Signer
        uses: actions/checkout@v4
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ inputs.signer_ref || '3571bf4dc70919d56e3c3d0d47f005b833960306' }}
          path: bloom-signer
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure shared W0 build directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bloom-w0-target" >> "$GITHUB_ENV"
      - name: Restore W0 build cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bloom-w0-target
          key: >-
            macos-w0-target-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('bloom/Cargo.lock', 'bloom-broker/Cargo.lock',
            'bloom-signer/Cargo.lock') }}

      - name: Build W0 triad payload
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --manifest-path bloom/Cargo.toml --release -p bloom --locked
          cargo build --manifest-path bloom-broker/Cargo.toml --release -p bloom-broker --locked
          cargo build --manifest-path bloom-signer/Cargo.toml --release -p bloom-signer --locked
          mkdir -p "$RUNNER_TEMP/triad-staging/bin" "$RUNNER_TEMP/triad-dist"
          cp "$CARGO_TARGET_DIR/release/bloom" "$RUNNER_TEMP/triad-staging/bin/"
          cp "$CARGO_TARGET_DIR/release/bloom-broker" "$RUNNER_TEMP/triad-staging/bin/"
          cp "$CARGO_TARGET_DIR/release/bloom-signer" "$RUNNER_TEMP/triad-staging/bin/"
          /usr/bin/ssh-keygen \
            -q \
            -t ed25519 \
            -N '' \
            -f "$RUNNER_TEMP/w0-release-key"
          export BLOOM_PLATFORM_CLAIM=macos-unix-principals-w0
          export BLOOM_ALLOW_MACOS_UNIX_W0=true
          export BLOOM_MACHINE_SHA
          export BLOOM_BROKER_SHA
          export BLOOM_SIGNER_SHA
          BLOOM_MACHINE_SHA="$(git -C bloom rev-parse HEAD)"
          BLOOM_BROKER_SHA="$(git -C bloom-broker rev-parse HEAD)"
          BLOOM_SIGNER_SHA="$(git -C bloom-signer rev-parse HEAD)"
          bloom/packaging/triad/release/build-bundle.sh \
            "$RUNNER_TEMP/triad-staging" \
            "$RUNNER_TEMP/triad-dist/bloom-triad.tar.gz" \
            "$RUNNER_TEMP/w0-release-key" \
            1700000000
          bloom/packaging/triad/release/verify-bundle.sh \
            "$RUNNER_TEMP/triad-dist/bloom-triad.tar.gz" \
            "$RUNNER_TEMP/triad-dist/bloom-triad.tar.gz.sha256" \
            "$RUNNER_TEMP/triad-dist/bloom-triad.tar.gz.sig" \
            "$RUNNER_TEMP/triad-dist/bloom-triad.tar.gz.pub"
          mkdir "$RUNNER_TEMP/verified"
          tar -xzf \
            "$RUNNER_TEMP/triad-dist/bloom-triad.tar.gz" \
            -C "$RUNNER_TEMP/verified"

      - name: Upload verified W0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: macos-w0-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/triad-dist
            ${{ runner.temp }}/verified/bloom-triad
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  disposable-w0:
    needs: build-w0
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out Machine
        uses: actions/checkout@v4
        with:
          path: bloom
      - name: Check out Broker
        uses: actions/checkout@v4
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ inputs.broker_ref || 'master' }}
          path: bloom-broker
      - name: Check out Signer
        uses: actions/checkout@v4
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ inputs.signer_ref || 'master' }}
          path: bloom-signer
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure shared W0 acceptance directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bloom-w0-target" >> "$GITHUB_ENV"
      - name: Restore W0 build cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bloom-w0-target
          key: >-
            macos-w0-target-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('bloom/Cargo.lock', 'bloom-broker/Cargo.lock',
            'bloom-signer/Cargo.lock') }}
      - name: Download verified W0 candidate
        uses: actions/download-artifact@v4
        with:
          name: macos-w0-build-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Prove disposable host prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          login_uid="$(id -u)"
          sudo launchctl print "gui/$login_uid" >/dev/null
          printf '%s\n' bloom-macos-unix-w0-disposable-v1 |
            sudo tee /private/var/db/bloom-w0-disposable-host >/dev/null
          sudo chown root:wheel /private/var/db/bloom-w0-disposable-host
          sudo chmod 0644 /private/var/db/bloom-w0-disposable-host
          sudo /usr/sbin/systemsetup -setusingnetworktime on
          sudo /usr/sbin/systemsetup -getusingnetworktime |
            grep -Fx "Network Time: On"
          sudo /bin/launchctl print system/com.apple.timed >/dev/null
          sudo install \
            -o root \
            -g wheel \
            -m 0644 \
            "$RUNNER_TEMP/verified/bloom-triad/RELEASE_PUBLIC_KEY.pem" \
            /private/var/db/bloom-w0-release-key.pem

      - name: Run destructive W0 isolation checks
        shell: bash
        run: |
          set -Eeuo pipefail
          login_uid="$(id -u)"
          login_user="$(id -un)"
          mkdir "$RUNNER_TEMP/macos-w0-evidence"
          sudo env \
            BLOOM_RUN_MACOS_UNIX_W0=true \
            BLOOM_RELEASE_PUBLIC_KEY=/private/var/db/bloom-w0-release-key.pem \
            BLOOM_MACOS_INSTALLED_ACCEPTANCE_MAIN_ROOT="$GITHUB_WORKSPACE/bloom" \
            BLOOM_MACOS_INSTALLED_ACCEPTANCE_BROKER_ROOT="$GITHUB_WORKSPACE/bloom-broker" \
            BLOOM_MACOS_INSTALLED_ACCEPTANCE_SIGNER_ROOT="$GITHUB_WORKSPACE/bloom-signer" \
            BLOOM_MACOS_W0_EVIDENCE_DIR="$RUNNER_TEMP/macos-w0-evidence" \
            BLOOM_MACOS_ACCEPTANCE_CARGO="$(command -v cargo)" \
            BLOOM_MACOS_ACCEPTANCE_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            BLOOM_MACOS_ACCEPTANCE_RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            bloom/packaging/triad/macos/w0/run-disposable.sh \
            "$RUNNER_TEMP/verified/bloom-triad" \
            "$login_uid" \
            "$login_user"

      - name: Record tested release subject
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$RUNNER_TEMP/verified/bloom-triad"
          subject="$(
            bloom/packaging/triad/release/macos-conformance-subject.sh \
              "$payload"
          )"
          archive_sha="$(
            shasum -a 256 "$RUNNER_TEMP/triad-dist/bloom-triad.tar.gz" |
              awk '{print $1}'
          )"
          {
            printf 'schema=bloom.macos-w0-subject.1\n'
            printf 'release_subject_digest=%s\n' "$subject"
            printf 'w0_candidate_archive_sha256=%s\n' "$archive_sha"
            cat "$payload/SOURCE_REVISIONS"
          } > "$RUNNER_TEMP/macos-w0-subject.txt"

      - name: Upload W0 subject evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-w0-subject-${{ github.sha }}
          path: ${{ runner.temp }}/macos-w0-subject.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload digest-bound W0 criteria
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-w0-criteria-${{ github.sha }}
          path: ${{ runner.temp }}/macos-w0-evidence/*.pass
          if-no-files-found: error
          retention-days: 30

      - name: Upload W0 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-w0-failure-${{ github.sha }}
          path: ${{ runner.temp }}/macos-w0-evidence/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove W0 host markers
        if: always()
        shell: bash
        run: |
          sudo rm -f \
            /private/var/db/bloom-w0-disposable-host \
            /private/var/db/bloom-w0-release-key.pem
