[workspace]
members = [
  "crates/bloom",
  "crates/bloom-daemon",
  "crates/bloom-vfs",
  "crates/bloom-chain",
  "crates/bloom-rpc",
  "crates/bloom-tx",
  "crates/bloom-keystore",
  "crates/bloom-defi",
  "crates/bloom-watch",
  "crates/bloom-mount",
  "crates/bloom-proto",
  "crates/bloom-tools",
  "crates/bloom-etherscan",
  "crates/bloom-ens",
  "crates/bloom-prices",
  "crates/bloom-revert",
  "crates/bloom-it",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bloom-directory/bloom"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
parking_lot = "0.12"
dirs = "5"
shellexpand = "3"
hex = "0.4"
blake3 = "1"
sha3 = "0.10"
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
humantime = "2"
humantime-serde = "1"
tempfile = "3"
once_cell = "1"
futures = "0.3"
lru = "0.12"

# Ethereum stack
alloy = { version = "2", features = ["full", "signer-local", "rpc-types", "providers", "provider-http", "consensus", "network", "rlp", "json-abi", "k256", "eips", "essentials", "contract", "transport-throttle", "json-rpc"] }
alloy-dyn-abi = { version = "1.5", features = ["eip712"] }

# Internal crates
bloom-proto    = { path = "crates/bloom-proto" }
bloom-keystore = { path = "crates/bloom-keystore" }
bloom-rpc      = { path = "crates/bloom-rpc" }
bloom-chain    = { path = "crates/bloom-chain" }
bloom-tx       = { path = "crates/bloom-tx" }
bloom-vfs      = { path = "crates/bloom-vfs" }
bloom-tools    = { path = "crates/bloom-tools" }
bloom-defi     = { path = "crates/bloom-defi" }
bloom-watch    = { path = "crates/bloom-watch" }
bloom-mount    = { path = "crates/bloom-mount" }
bloom-etherscan = { path = "crates/bloom-etherscan" }
bloom-ens      = { path = "crates/bloom-ens" }
bloom-prices   = { path = "crates/bloom-prices" }
bloom-revert   = { path = "crates/bloom-revert" }
bloom-daemon   = { path = "crates/bloom-daemon" }

[profile.release]
lto = "thin"
codegen-units = 1
