[workspace]
members = [
  "crates/bloom",
  "crates/bloom-machine",
  "crates/bloom-daemon",
  "crates/bloom-vfs",
  "crates/bloom-paid-mpp",
  "crates/bloom-paid-x402",
  "crates/bloom-paid-http",
  "crates/bloom-evm",
  "crates/bloom-rpc",
  "crates/bloom-tx",
  "crates/bloom-mempool",
  "crates/bloom-machine-client",
  "crates/bloom-watch",
  "crates/bloom-mount",
  "crates/bloom-proto",
  "crates/bloom-tools",
  "crates/bloom-etherscan",
  "crates/bloom-ens",
  "crates/bloom-prices",
  "crates/bloom-revert",
  "crates/bloom-petals",
  "crates/bloom-it",
  "crates/bloom-update",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bloom-directory/bloom"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
parking_lot = "0.12"
dirs = "5"
hex = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }
blake3 = "1"
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
ml-dsa = { version = "0.1.0", features = ["getrandom", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1"
mpp = { version = "0.10.4", default-features = false, features = ["client", "tempo", "reqwest-rustls-tls"] }
url = "2"
humantime = "2"
humantime-serde = "1"
tempfile = "3"
futures = "0.3"
lru = "0.12"
fs2 = "0.4"
bloom-audit-checkpoint = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "2e402f03814166406ea6489b60422b0865d1f6c2" }
wasmtime = { version = "26", default-features = false, features = ["async", "cranelift", "runtime", "cache", "parallel-compilation"] }
wasmtime-wasi = "26"
wat = "1"
# danger-allow-state-serialisation: webauthn-rs requires this feature to allow
# the PasskeyRegistration / PasskeyAuthentication state structs to be serialised
# across await points. Our ceremony server holds state in Arc<Mutex<>> for the
# duration of a single short-lived HTTP server, so this is safe — we never
# persist the state to disk or send it across a network boundary.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
open = "5"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# QR rendering for deposit addresses. `svg` is a dependency-free string renderer
# (for `wallet address --qr-out`); we drop the heavy `image`/PNG renderer. The
# built-in unicode renderer covers the terminal QR.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Echo-free passphrase entry for interactive wallet creation.
rpassword = "7"
serde_jcs = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
ciborium = "0.2"

# Ethereum stack
alloy = { version = "2", default-features = false, features = ["std", "reqwest", "reqwest-rustls-tls", "rpc-types", "providers", "provider-http", "provider-ws-ring", "consensus", "network", "rlp", "json-abi", "k256", "eips", "contract", "transport-throttle", "json-rpc", "signers"] }
alloy-dyn-abi = { version = "1.5", features = ["eip712"] }
# OP Stack typed RPC (Base, Optimism deposit/system transactions & receipts).
op-alloy = { version = "2", features = ["rpc-types", "consensus", "serde", "network"] }

# Internal crates
bloom-mempool  = { path = "crates/bloom-mempool" }
bloom-proto    = { path = "crates/bloom-proto" }
bloom-rpc      = { path = "crates/bloom-rpc" }
bloom-evm      = { path = "crates/bloom-evm" }
bloom-tx       = { path = "crates/bloom-tx" }
bloom-vfs      = { path = "crates/bloom-vfs" }
bloom-paid-mpp = { path = "crates/bloom-paid-mpp" }
bloom-paid-x402 = { path = "crates/bloom-paid-x402" }
bloom-paid-http = { path = "crates/bloom-paid-http" }
bloom-tools    = { path = "crates/bloom-tools" }
bloom-watch    = { path = "crates/bloom-watch" }
bloom-mount    = { path = "crates/bloom-mount" }
bloom-etherscan = { path = "crates/bloom-etherscan" }
bloom-ens      = { path = "crates/bloom-ens" }
bloom-prices   = { path = "crates/bloom-prices" }
bloom-revert   = { path = "crates/bloom-revert" }
bloom-petals   = { path = "crates/bloom-petals" }
bloom-petal-contract = { git = "https://github.com/bloom-directory/petal", rev = "eda6647c523bba161eaa22812aa0e75ec7782404" }
bloom-daemon   = { path = "crates/bloom-daemon" }
bloom-update   = { path = "crates/bloom-update" }
bloom-broker-api = { git = "https://github.com/bloom-directory/bloom-broker.git", rev = "c05d9519b97dc74cf49fb293daf374f8db30c7af" }
bloom-rpc-wire = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "2e402f03814166406ea6489b60422b0865d1f6c2" }
bloom-triad-local-transport = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "2e402f03814166406ea6489b60422b0865d1f6c2" }
bloom-service-activation = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "2e402f03814166406ea6489b60422b0865d1f6c2" }
bloom-trusted-time = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "2e402f03814166406ea6489b60422b0865d1f6c2" }
bloom-machine-client = { path = "crates/bloom-machine-client" }
# ---- example core petal: generic capability primitives (/bloom/core/cap) ----

[profile.release]
lto = "thin"
codegen-units = 1
