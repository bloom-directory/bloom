[package]
name = "bloom-petal-dex-it"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Integration tests for the bloom DEX petal suite (pool + cpmm + router)"
publish = false

[dependencies]
bloom-chain-node     = { path = "../../../../crates/bloom-chain-node" }
bloom-chain-state    = { path = "../../../../crates/bloom-chain-state" }
bloom-chain-types    = { path = "../../../../crates/bloom-chain-types" }
bloom-objects        = { path = "../../../../crates/bloom-objects" }
bloom-script         = { path = "../../../../crates/bloom-script" }
bloom-resource       = { path = "../../../../crates/bloom-resource" }
bloom-petal-fungible = { path = "../../../../crates/bloom-petal-fungible" }
bloom-petal-manifest = { path = "../../../../crates/bloom-petal-manifest" }
bloom-petal-dex-pool   = { path = "../../crates/bloom-petal-dex-pool",   features = ["no-entrypoint"] }
bloom-petal-dex-cpmm   = { path = "../../crates/bloom-petal-dex-cpmm",   features = ["no-entrypoint"] }
bloom-petal-dex-router = { path = "../../crates/bloom-petal-dex-router", features = ["no-entrypoint"] }
bloom-dex-math       = { path = "../../crates/bloom-dex-math" }
blake3               = "1"
anyhow               = "1"
wat                  = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
