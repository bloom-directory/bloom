[package]
name = "bloom-petal-dex-router"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DEX router petal (quote_Nhop + swap_Nhop, N = 1..3) — multi-hop swap inlining"
publish = false

[lib]
name = "bloom_petal_dex_router"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource        = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects         = { workspace = true }
bloom-dex-math        = { workspace = true }
bloom-petal-dex-pool  = { workspace = true, features = ["no-entrypoint"] }
bloom-petal-fungible  = { workspace = true, features = ["no-entrypoint"] }

[features]
default = []
# Suppress the wasm `__petal_<fn>` entrypoints when this crate is compiled
# as a transitive `rlib` dependency of another petal. Mirrors the pattern
# used by bloom-petal-fungible, bloom-petal-cap, and bloom-petal-dex-pool.
no-entrypoint = []
