[package]
name = "bloom-petal-dex-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DEX wallet/settlement petal (/bloom/petals/dex/wallet) — receive() settles a swapped Coin<Erased> to a recipient"
publish = false

[lib]
name = "bloom_petal_dex_wallet"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects = { workspace = true }

[features]
default = []
# Suppress the wasm `__petal_<fn>` entrypoints when compiled as a transitive
# rlib dependency. Mirrors bloom-petal-dex-pool.
no-entrypoint = []
