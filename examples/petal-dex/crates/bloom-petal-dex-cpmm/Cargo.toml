[package]
name = "bloom-petal-dex-cpmm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ConstantProduct swap strategy (type-only petal)"
publish = false

[lib]
name = "bloom_petal_dex_cpmm"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects = { workspace = true }
bloom-dex-math = { workspace = true }

[features]
default = []
# Suppress the wasm `__petal_<fn>` entrypoints when this crate is compiled
# as a transitive `rlib` dependency of another petal. Mirrors the pattern
# used by bloom-petal-fungible and bloom-petal-cap.
no-entrypoint = []
