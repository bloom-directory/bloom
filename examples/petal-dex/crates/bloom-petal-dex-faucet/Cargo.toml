[package]
name = "bloom-petal-dex-faucet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DEX test faucet petal (/bloom/petals/dex/faucet) — mint() creates a Coin<Erased> for live-chain pool/swap provisioning"
publish = false

[lib]
name = "bloom_petal_dex_faucet"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects = { workspace = true }

[features]
default = []
# Suppress the wasm `__petal_<fn>` entrypoints when compiled as a transitive
# rlib dependency. Mirrors bloom-petal-dex-pool / bloom-petal-dex-wallet.
no-entrypoint = []
