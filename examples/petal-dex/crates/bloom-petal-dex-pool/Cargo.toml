[package]
name = "bloom-petal-dex-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DEX pool petal (Pool<A, B, S>, LpPosition<A, B, S>) — strategy-generic CPMM/Stableswap host"
publish = false

[lib]
name = "bloom_petal_dex_pool"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects = { workspace = true }
bloom-dex-math = { workspace = true }

[features]
default = []
# Suppress the wasm `__petal_<fn>` entrypoints when this crate is compiled
# as a transitive `rlib` dependency of another petal (e.g. router). Mirrors
# the `bloom-petal-fungible` no-entrypoint pattern.
no-entrypoint = []
