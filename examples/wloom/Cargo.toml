[package]
name = "bloom-dex-wloom"
version = "0.1.0"
edition = "2024"
description = "Wrapped native LOOM ERC-20 petal for bloom-chain DEX (wETH9 analog)"
license = "MIT"

[lib]
name = "bloom_dex_wloom"
# `rlib` alongside `cdylib` so sibling petals (router) can
# `use bloom_dex_wloom::{Wloom, calls as wloom_calls}` for typed
# cross-contract calls and hand-rolled calldata builders. The `cdylib`
# artefact is the wasm petal that ships on-chain.
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-contract = { workspace = true, default-features = false }
bloom-chain-abi = { workspace = true, default-features = false }
bloom-petal-sdk = { workspace = true }
bloom-dex-erc20 = { path = "../dex/crates/bloom-dex-erc20", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blake3 = { version = "1", default-features = false }
