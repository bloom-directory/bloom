[package]
name = "bloom-petal-cap"
version = "0.1.0"
edition = "2024"
description = "Bloom-native petal at `/bloom/petals/core/cap` — generic capability primitives (spec §5 + §18)."
license = "MIT"

[lib]
name = "bloom_petal_cap"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects = { workspace = true }

[features]
default = []
# Suppress the wasm `__petal_<fn>` entrypoints when this crate is compiled
# as a transitive `rlib` dependency of *another* petal. Mirrors the
# Dependent petals must enable `no-entrypoint` so cargo's feature-unification
# doesn't ship a single wasm with both petals' exports.
no-entrypoint = []
