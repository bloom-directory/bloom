schema = "bloom.petal.local.v1"
name = "polymarket"

[provides]
kind = "vfs"
mount = "polymarket"
caps = ["vfs.read", "vfs.write", "net.fetch", "sign", "store"]

[[net.allow]]
host = "gamma-api.polymarket.com"
methods = ["GET"]
paths = ["/markets*", "/public-search*"]

[[net.allow]]
host = "data-api.polymarket.com"
methods = ["GET"]
paths = ["/positions*", "/trades*", "/activity*"]

[[net.allow]]
host = "polymarket.com"
methods = ["GET"]
paths = ["/api/geoblock"]

[[net.allow]]
host = "clob.polymarket.com"
methods = ["GET"]
paths = ["/book", "/midpoint", "/spread", "/price", "/auth/derive-api-key", "/data/orders", "/balance-allowance"]

[[net.allow]]
host = "clob.polymarket.com"
methods = ["POST"]
paths = ["/auth/api-key", "/order"]

[[net.allow]]
host = "clob.polymarket.com"
methods = ["DELETE"]
paths = ["/order"]

[[endpoint]]
path = "markets/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "markets/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "meta/*"
cache_ttl_ms = 30000

[[endpoint]]
path = "search/*"
cache_ttl_ms = 30000

[[endpoint]]
path = "positions/*"
cache_ttl_ms = 10000

[[endpoint]]
path = "positions/*/*"
cache_ttl_ms = 10000

[[endpoint]]
path = "onboard/*"

[[endpoint]]
path = "onboard/*/*"

[[endpoint]]
path = "onboard/*/begin"
write = true
async = true

[[endpoint]]
path = "account/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "account/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/*/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/new"
write = true

[[endpoint]]
path = "trade/*/drafts/*/revalidate"
write = true

[[endpoint]]
path = "trade/*/drafts/*/post"
write = true

[[endpoint]]
path = "trade/*/receipts/*/cancel"
write = true

[[endpoint]]
path = "fund/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "fund/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "fund/*/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "fund/*/new"
write = true
