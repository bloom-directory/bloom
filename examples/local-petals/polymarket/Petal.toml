schema = "bloom.petal.local.v1"
name = "polymarket"

[provides]
kind = "vfs"
mount = "polymarket"
caps = ["vfs.read", "net.fetch", "sign", "store"]

[[net.allow]]
host = "gamma-api.polymarket.com"
methods = ["GET"]
paths = ["/markets*", "/public-search*"]

[[net.allow]]
host = "data-api.polymarket.com"
methods = ["GET"]
paths = ["/positions*", "/trades*", "/activity*"]

[[net.allow]]
host = "clob.polymarket.com"
methods = ["GET", "POST"]
paths = ["/book*", "/midpoint*", "/spread*", "/price*", "/auth/*"]

[[endpoint]]
path = "markets/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "markets/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "search/*"
cache_ttl_ms = 30000

[[endpoint]]
path = "positions/*"
cache_ttl_ms = 10000

[[endpoint]]
path = "positions/*/*"
cache_ttl_ms = 10000

[[endpoint]]
path = "onboard/*"

[[endpoint]]
path = "onboard/*/*"

[[endpoint]]
path = "onboard/*/begin"
write = true
async = true

[[endpoint]]
path = "account/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "account/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/*/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "trade/*/new"
write = true

[[endpoint]]
path = "fund/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "fund/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "fund/*/*/*"
cache_ttl_ms = 5000

[[endpoint]]
path = "fund/*/new"
write = true
