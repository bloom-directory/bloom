[package]
name = "bloom-local-petal-polymarket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Example local Bloom handler petal for the Polymarket VFS surface"
publish = false

[lib]
name = "bloom_local_petal_polymarket"
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "signer-local", "sol-types", "std"] }
base64 = { workspace = true }
blake3 = { workspace = true }
bloom-polymarket = { path = "../../../crates/bloom-polymarket", default-features = false }
bloom-petal-sdk = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
bloom-petal-manifest = { workspace = true }
bloom-petals = { workspace = true }
bloom-vfs = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
