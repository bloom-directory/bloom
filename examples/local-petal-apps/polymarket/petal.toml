schema = "bloom.petal.local-app.v2"
name = "polymarket"
version = "0.1.0"
description = "Polymarket markets, onboarding, funding, account, and reviewable trading as a v2 Bloom app package."

[consent]
summary = "Expose /apps/polymarket, fetch Polymarket APIs, store local credential/order/onboarding/funding state, and request wallet signatures for auth, onboarding, and order review flows."

[caps]
allowed = [
  "bloom:http",
  "bloom:store",
  "bloom:sign",
  "bloom:vfs.read",
  "bloom:vfs.write",
]

[[net.allow]]
host = "gamma-api.polymarket.com"
methods = ["GET"]
paths = ["/markets*", "/public-search*"]

[[net.allow]]
host = "data-api.polymarket.com"
methods = ["GET"]
paths = ["/positions*", "/trades*", "/activity*"]

[[net.allow]]
host = "polymarket.com"
methods = ["GET"]
paths = ["/api/geoblock"]

[[net.allow]]
host = "clob.polymarket.com"
methods = ["GET"]
paths = [
  "/book",
  "/midpoint",
  "/spread",
  "/price",
  "/auth/derive-api-key",
  "/auth/builder-api-key",
  "/data/orders",
  "/balance-allowance",
  "/balance-allowance/update",
]

[[net.allow]]
host = "clob.polymarket.com"
methods = ["POST"]
paths = ["/auth/api-key", "/auth/builder-api-key", "/order"]

[[net.allow]]
host = "clob.polymarket.com"
methods = ["DELETE"]
paths = ["/order"]

[[net.allow]]
host = "relayer-v2.polymarket.com"
methods = ["GET", "POST"]
paths = ["/nonce", "/submit", "/transaction"]

[sign]
allowed_intents = [
  "polymarket.clob_auth",
  "polymarket.order.poly1271",
  "polymarket.relayer_batch",
]

[store]
namespaces = ["fund", "onboard", "trade"]
secret_namespaces = ["creds"]
