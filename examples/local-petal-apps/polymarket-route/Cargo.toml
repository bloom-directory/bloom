[package]
name = "bloom-polymarket-v2-route"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "signer-local", "sol-types", "std"] }
base64 = "0.22"
blake3 = "1"
bloom-polymarket = { path = "../../../crates/bloom-polymarket", default-features = false }
getrandom = { version = "0.2", features = ["custom"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
url = "2"
wit-bindgen = "=0.57.1"
