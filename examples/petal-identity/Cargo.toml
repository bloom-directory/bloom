[package]
name = "bloom-petal-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trivial generic identity petal — de-risk fixture for generic-dispatch monomorphization (spec Phase A)"
publish = false

[lib]
name = "bloom_petal_identity"
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-resource = { workspace = true }
bloom-resource-macros = { workspace = true }
bloom-objects = { workspace = true }

[dev-dependencies]
# The `#[ignore]`-gated wasm32 e2e test compiles this petal to
# `wasm32-unknown-unknown`, inspects the emitted exports, then runs the
# real export end-to-end through the chain VM (Phase A gate).
wasmparser = { workspace = true }
bloom-chain-node = { path = "../../crates/bloom-chain-node" }
bloom-chain-state = { path = "../../crates/bloom-chain-state" }
bloom-chain-types = { path = "../../crates/bloom-chain-types" }
bloom-petals = { path = "../../crates/bloom-petals" }
bloom-script = { path = "../../crates/bloom-script" }
bloom-petal-manifest = { workspace = true }
bloom-petal-fungible = { workspace = true }
blake3 = "1"

[features]
default = []
# Suppress the wasm `__petal_<fn>` entrypoints when compiled as a transitive
# rlib dependency (mirrors bloom-petal-dex-cpmm).
no-entrypoint = []
