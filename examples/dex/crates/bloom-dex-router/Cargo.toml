[package]
name = "bloom-dex-router"
version = "0.1.0"
edition = "2024"
description = "Uniswap-v2-style DEX router petal for bloom-chain"
license = "MIT"

[lib]
name = "bloom_dex_router"
# `rlib` alongside `cdylib` so the dex CLI can `use bloom_dex_router::{Router,
# calls as router_calls}` for typed selector + calldata building. The `cdylib`
# artefact is the wasm petal that ships on-chain.
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-contract = { workspace = true, default-features = false }
bloom-chain-abi = { workspace = true, default-features = false }
bloom-petal-sdk = { workspace = true }

# Sibling DEX petals — depended on as rlibs for their `Interface` traits and
# hand-rolled `calls` modules. Linking does not pull in their petal entry
# points because the router only references items under `<crate>::calls` and
# their interface marker types.
bloom-dex-factory = { path = "../bloom-dex-factory", default-features = false }
bloom-dex-pair    = { path = "../bloom-dex-pair",    default-features = false }
bloom-dex-erc20   = { path = "../bloom-dex-erc20",   default-features = false }
bloom-dex-wloom   = { path = "../../../wloom",       default-features = false }

# blake3 is used in host-side unit tests (non-wasm32) to verify selectors.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blake3 = { version = "1", default-features = false }
