[package]
name = "bloom-dex-erc20"
version = "0.1.0"
edition = "2024"
description = "ERC-20 fungible token petal for bloom-chain DEX"
license = "MIT"

[lib]
name = "bloom_dex_erc20"
# `rlib` is added alongside `cdylib` so sibling DEX petals (router) can
# `use bloom_dex_erc20::erc20` to access the macro-emitted `abi::call::*`
# calldata builders. The `cdylib` artefact is still the wasm petal that
# ships on-chain.
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-chain-abi = { workspace = true, default-features = false }
bloom-petal-sdk = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blake3 = { version = "1", default-features = false }
