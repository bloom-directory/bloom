[package]
name = "bloom-dex-factory"
version = "0.1.0"
edition = "2024"
description = "Uniswap-v2-style DEX factory petal for bloom-chain: deploys pair petals and maintains the pair registry"
license = "MIT"

[lib]
name = "bloom_dex_factory"
# `rlib` is added alongside `cdylib` so sibling DEX petals (router) can
# `use bloom_dex_factory::factory` to access the macro-emitted
# `abi::call::*` calldata builders. The `cdylib` artefact is still the wasm
# petal that ships on-chain.
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-chain-abi = { workspace = true, default-features = false }
bloom-petal-sdk = { workspace = true }

# Host-side parity tests hash canonical method/event signature strings with
# blake3 directly (no separate ABI crate). Production code paths use nothing
# from this section.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blake3 = { version = "1", default-features = false }
