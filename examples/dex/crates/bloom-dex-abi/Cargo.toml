[package]
name = "bloom-dex-abi"
version = "0.1.0"
edition = "2024"
description = "ABI types and selectors for the bloom-chain DEX petals"
license = "MIT"

[lib]
name = "bloom_dex_abi"

[build-dependencies]
blake3 = { version = "1", default-features = false }

[dependencies]
bloom-chain-abi = { workspace = true }

[features]
default = ["std"]
std = ["bloom-chain-abi/std"]

[dev-dependencies]
# nothing extra needed; tests use std
