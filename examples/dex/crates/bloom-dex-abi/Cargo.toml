[package]
name = "bloom-dex-abi"
version = "0.1.0"
edition = "2024"
description = "ABI types and selectors for the bloom-chain DEX petals"
license = "MIT"

[lib]
name = "bloom_dex_abi"

[build-dependencies]
blake3 = { version = "1", default-features = false }

[dependencies]
# No runtime deps needed — selectors are generated at build time.

[features]
default = ["std"]
std = []

[dev-dependencies]
# nothing extra needed; tests use std
