[package]
name = "bloom-dex-pair"
version = "0.1.0"
edition = "2024"
description = "Uniswap-v2-style AMM pair petal with embedded LP token for bloom-chain DEX"
license = "MIT"

[lib]
name = "bloom_dex_pair"
# `rlib` alongside `cdylib` so sibling DEX petals (router) can
# `use bloom_dex_pair::{Pair, calls as pair_calls}` for typed
# cross-contract calls and hand-rolled calldata builders. The `cdylib`
# artefact is the wasm petal that ships on-chain.
crate-type = ["cdylib", "rlib"]

[dependencies]
bloom-contract = { workspace = true, default-features = false }
bloom-chain-abi = { workspace = true, default-features = false }
bloom-petal-sdk = { workspace = true }
bloom-dex-erc20 = { path = "../bloom-dex-erc20", default-features = false }

# blake3 is used in host-side unit tests (non-wasm32) to verify selectors.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blake3 = { version = "1", default-features = false }
